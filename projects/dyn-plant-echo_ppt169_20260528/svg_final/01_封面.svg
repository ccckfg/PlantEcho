<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5016"/>
      <stop offset="50%" stop-color="#3A6520"/>
      <stop offset="100%" stop-color="#4A7C28"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#E8A849" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8A849" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#6B9B37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6B9B37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#coverBg)"/>

  <!-- Decorative glows -->
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- Organic decorative circles -->
  <circle cx="180" cy="120" r="60" fill="#6B9B37" fill-opacity="0.08"/>
  <circle cx="250" cy="180" r="35" fill="#8BBF4A" fill-opacity="0.06"/>
  <circle cx="1050" cy="580" r="80" fill="#6B9B37" fill-opacity="0.07"/>
  <circle cx="1120" cy="520" r="45" fill="#8BBF4A" fill-opacity="0.05"/>
  <circle cx="900" cy="100" r="25" fill="#E8A849" fill-opacity="0.08"/>
  <circle cx="350" cy="600" r="40" fill="#6B9B37" fill-opacity="0.06"/>

  <!-- Leaf decorative elements -->
  <g id="leafDecor1" transform="translate(100, 200) rotate(-30)">
    <ellipse cx="0" cy="0" rx="8" ry="25" fill="#6B9B37" fill-opacity="0.12"/>
    <ellipse cx="0" cy="0" rx="3" ry="25" fill="#8BBF4A" fill-opacity="0.08"/>
  </g>
  <g id="leafDecor2" transform="translate(1180, 500) rotate(20)">
    <ellipse cx="0" cy="0" rx="10" ry="30" fill="#6B9B37" fill-opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="4" ry="30" fill="#8BBF4A" fill-opacity="0.06"/>
  </g>
  <g id="leafDecor3" transform="translate(1100, 150) rotate(-45)">
    <ellipse cx="0" cy="0" rx="7" ry="22" fill="#6B9B37" fill-opacity="0.1"/>
  </g>

  <!-- Small leaf accents -->
  <g transform="translate(300, 100) rotate(15)">
    <ellipse cx="0" cy="0" rx="5" ry="16" fill="#8BBF4A" fill-opacity="0.1"/>
  </g>
  <g transform="translate(950, 620) rotate(-25)">
    <ellipse cx="0" cy="0" rx="6" ry="18" fill="#8BBF4A" fill-opacity="0.08"/>
  </g>

  <!-- Main content area -->
  <!-- Heart icon -->
  <!-- icon: tabler-filled/heart -->
  <g transform="translate(590.0, 180.0) scale(2.3333333333333335)" fill="#E8A849">
    <path d="M6.979 3.074a6 6 0 0 1 4.988 1.425l.037 .033l.034 -.03a6 6 0 0 1 4.733 -1.44l.246 .036a6 6 0 0 1 3.364 10.008l-.18 .185l-.048 .041l-7.45 7.379a1 1 0 0 1 -1.313 .082l-.094 -.082l-7.493 -7.422a6 6 0 0 1 3.176 -10.215z" />
  </g>

  <!-- Main title -->
  <text x="640" y="290" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="66" font-weight="bold" fill="#FFFFFF">
    DYN Plant Echo
  </text>

  <!-- Subtitle -->
  <text x="640" y="350" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" fill="#D4E8C0">
    与植物一起呼吸的陪伴系统
  </text>

  <!-- Divider line -->
  <line x1="520" y1="385" x2="760" y2="385" stroke="#E8A849" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Tagline -->
  <text x="640" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#B8D4A0">
    让每一株植物，都有被听见的权利
  </text>

  <!-- Info line -->
  <text x="640" y="520" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#9BBF80">
    智能植物陪伴系统 · 期末汇报
  </text>
  <text x="640" y="548" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#8BAF70">
    2026年5月28日
  </text>

  <!-- Leaf icon bottom -->
  <!-- icon: tabler-filled/leaf -->
  <g transform="translate(615.0, 590.0) scale(1.3333333333333333)" fill="#6B9B37">
    <path d="M3.055 14.328l-.018 -.168l-.004 -.043a11 11 0 0 1 -.047 -1.12c.018 -6.29 4.29 -9.997 13 -9.997h4.014a1 1 0 0 1 1 1l-.002 2.057c-.498 8.701 -4.74 12.943 -11.998 12.943h-2.631a16 16 0 0 0 -.375 2.11a1 1 0 1 1 -1.988 -.22q .174 -1.568 .58 -2.947l-.118 -.146l-.208 -.28l-.157 -.229l-.182 -.293l-.098 -.171l-.065 -.122a6 6 0 0 1 -.397 -.941l-.072 -.237l-.085 -.327l-.057 -.268l-.043 -.242zm8.539 -4.242c-2.845 1.265 -4.854 3.13 -6.108 5.583q .098 .2 .218 .4l.185 .281l.07 .097q .12 .164 .258 .329l.197 .224h.649c1.037 -2.271 2.777 -3.946 5.343 -5.086a1 1 0 0 0 -.812 -1.828" />
  </g>

  <!-- Bottom decorative bar -->
  <rect x="0" y="700" width="1280" height="20" fill="#1A3A0E" fill-opacity="0.3"/>
</svg>
