<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    服务端架构
  </text>

  <!-- Tech stack bar -->
  <rect x="60" y="130" width="1160" height="50" rx="10" fill="#2D5016" fill-opacity="0.06"/>
  <text x="640" y="162" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" fill="#2D5016" font-weight="bold">Node.js 24 + TypeScript + Fastify + SQLite + sqlite-vec + Zod</text>

  <!-- 8 Module cards in 2x4 grid -->
  <!-- Row 1 -->
  <!-- Module 1: Device -->
  <g id="mod-device">
    <rect x="60" y="200" width="270" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="200" width="270" height="110" rx="10" fill="none" stroke="#4A7C28" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/settings" x="80" y="215" width="28" height="28" fill="#4A7C28"/>
    <text x="116" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">设备管理</text>
    <text x="80" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">读数上传 · 待认领登记</text>
    <text x="80" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">认领 · 密钥校验/轮换</text>
    <text x="80" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">MQTT 自动下发设备密钥</text>
  </g>

  <!-- Module 2: Plant -->
  <g id="mod-plant">
    <rect x="350" y="200" width="270" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="350" y="200" width="270" height="110" rx="10" fill="none" stroke="#4A7C28" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/leaf" x="370" y="215" width="28" height="28" fill="#4A7C28"/>
    <text x="406" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">植物档案</text>
    <text x="370" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">档案 · 状态 · 读数历史</text>
    <text x="370" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">Care Profile 建议</text>
    <text x="370" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">LLM / 模板双模式</text>
  </g>

  <!-- Module 3: Chat -->
  <g id="mod-chat">
    <rect x="640" y="200" width="270" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="640" y="200" width="270" height="110" rx="10" fill="none" stroke="#E8A849" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/message-circle" x="660" y="215" width="28" height="28" fill="#E8A849"/>
    <text x="696" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">聊天引擎</text>
    <text x="660" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">流式 + 非流式对话</text>
    <text x="660" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">LLM 不可用时 fallback</text>
    <text x="660" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">OpenAI-compatible API</text>
  </g>

  <!-- Module 4: Memory -->
  <g id="mod-memory">
    <rect x="930" y="200" width="290" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="930" y="200" width="290" height="110" rx="10" fill="none" stroke="#E8A849" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/database" x="950" y="215" width="28" height="28" fill="#E8A849"/>
    <text x="986" y="235" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">记忆系统</text>
    <text x="950" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">AgentGal 生命周期管理</text>
    <text x="950" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">FTS5 + BM25 + sqlite-vec</text>
    <text x="950" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">Hybrid + 可选 Rerank</text>
  </g>

  <!-- Row 2 -->
  <!-- Module 5: Proactive -->
  <g id="mod-proactive">
    <rect x="60" y="330" width="270" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="330" width="270" height="110" rx="10" fill="none" stroke="#D4A574" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/bolt" x="80" y="345" width="28" height="28" fill="#D4A574"/>
    <text x="116" y="365" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">主动发言</text>
    <text x="80" y="390" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">传感器异常 · 天气提醒</text>
    <text x="80" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">用户自定义提醒</text>
    <text x="80" y="426" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">冷却去重 · LLM 润色</text>
  </g>

  <!-- Module 6: Sync -->
  <g id="mod-sync">
    <rect x="350" y="330" width="270" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="350" y="330" width="270" height="110" rx="10" fill="none" stroke="#D4A574" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/globe" x="370" y="345" width="28" height="28" fill="#D4A574"/>
    <text x="406" y="365" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">实时同步</text>
    <text x="370" y="390" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">SQLite sync_events</text>
    <text x="370" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">SSE 实时推送</text>
    <text x="370" y="426" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">多端实时刷新</text>
  </g>

  <!-- Module 7: Weather -->
  <g id="mod-weather">
    <rect x="640" y="330" width="270" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="640" y="330" width="270" height="110" rx="10" fill="none" stroke="#4A7C28" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/cloud" x="660" y="345" width="28" height="28" fill="#4A7C28"/>
    <text x="696" y="365" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">天气服务</text>
    <text x="660" y="390" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">代理和风天气 QWeather</text>
    <text x="660" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">实时天气 + 城市搜索</text>
    <text x="660" y="426" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">雨天自动提醒带伞</text>
  </g>

  <!-- Module 8: Auth -->
  <g id="mod-auth">
    <rect x="930" y="330" width="290" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="930" y="330" width="290" height="110" rx="10" fill="none" stroke="#4A7C28" stroke-width="1.5" stroke-opacity="0.3"/>
    <use data-icon="tabler-filled/shield-check" x="950" y="345" width="28" height="28" fill="#4A7C28"/>
    <text x="986" y="365" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">访问鉴权</text>
    <text x="950" y="390" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">APP_ACCESS_KEY 保护</text>
    <text x="950" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#6B7B6B">设备密钥 hash 校验</text>
    <text x="950" y="426" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">除设备读数外全量保护</text>
  </g>

  <!-- Storage layer summary -->
  <rect x="60" y="470" width="1160" height="100" rx="12" fill="#FFFFFF"/>
  <rect x="60" y="470" width="1160" height="100" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
  <text x="640" y="500" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">存储与校验层</text>

  <rect x="100" y="515" width="200" height="36" rx="6" fill="#2D5016" fill-opacity="0.06"/>
  <text x="200" y="539" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">SQLite</text>

  <rect x="320" y="515" width="200" height="36" rx="6" fill="#4A7C28" fill-opacity="0.06"/>
  <text x="420" y="539" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A7C28">sqlite-vec</text>

  <rect x="540" y="515" width="200" height="36" rx="6" fill="#E8A849" fill-opacity="0.06"/>
  <text x="640" y="539" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#8B6914">FTS5 / BM25</text>

  <rect x="760" y="515" width="200" height="36" rx="6" fill="#D4A574" fill-opacity="0.06"/>
  <text x="860" y="539" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#8B6914">Zod</text>

  <rect x="980" y="515" width="200" height="36" rx="6" fill="#4A7C28" fill-opacity="0.06"/>
  <text x="1080" y="539" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A7C28">background_jobs</text>

  <!-- Database tables hint -->
  <text x="640" y="595" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">
    plants · devices · sensor_readings · messages · plant_memories · plant_understandings · sync_events · proactive_event_log ...
  </text>

  <!-- Decorative -->
  <circle cx="1200" cy="650" r="15" fill="#4A7C28" fill-opacity="0.06"/>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">06 / 18</text>
</svg>
