<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    植响对话 &amp; 成长日记
  </text>

  <!-- Left: Chat -->
  <text x="80" y="150" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#4A7C28">植响对话</text>

  <rect x="60" y="170" width="580" height="420" rx="12" fill="#FFFFFF"/>
  <rect x="60" y="170" width="580" height="420" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>

  <!-- Chat header -->
  <rect x="60" y="170" width="580" height="50" rx="12" fill="#4A7C28" fill-opacity="0.06"/>
  <rect x="60" y="210" width="580" height="10" fill="#4A7C28" fill-opacity="0.06"/>
  <use data-icon="tabler-filled/leaf" x="80" y="180" width="28" height="28" fill="#4A7C28"/>
  <text x="115" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">小绿</text>
  <text x="115" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9B8B7B">在线 · 正在光合作用中</text>

  <!-- Chat messages -->
  <!-- User message -->
  <rect x="400" y="240" width="220" height="44" rx="12" fill="#4A7C28"/>
  <text x="510" y="262" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#FFFFFF">你今天看起来怎么样？</text>
  <text x="510" y="278" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="10" fill="#B8D4A0">14:32</text>

  <!-- Plant reply -->
  <rect x="80" y="300" width="300" height="60" rx="12" fill="#F5F0E8"/>
  <use data-icon="tabler-filled/leaf" x="95" y="312" width="20" height="20" fill="#4A7C28"/>
  <text x="120" y="328" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B">今天阳光真好！我刚喝完水，</text>
  <text x="120" y="348" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2B2B2B">叶子都舒展开了呢～</text>
  <text x="370" y="350" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="10" fill="#9B8B7B">14:32</text>

  <!-- Quick actions -->
  <text x="80" y="395" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">快捷动作</text>
  <rect x="80" y="405" width="90" height="28" rx="14" fill="#4A7C28" fill-opacity="0.1"/>
  <text x="125" y="424" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#4A7C28">已浇水</text>
  <rect x="180" y="405" width="90" height="28" rx="14" fill="#E8A849" fill-opacity="0.1"/>
  <text x="225" y="424" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">晒太阳</text>
  <rect x="280" y="405" width="120" height="28" rx="14" fill="#D4A574" fill-opacity="0.1"/>
  <text x="340" y="424" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">换了新位置</text>

  <!-- Memory citation -->
  <rect x="80" y="445" width="540" height="36" rx="8" fill="#E8A849" fill-opacity="0.06"/>
  <use data-icon="tabler-filled/book" x="95" y="452" width="20" height="20" fill="#E8A849"/>
  <text x="120" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">引用记忆: "从客厅搬到了东窗边" · 5月20日 · 相关度 0.91</text>

  <!-- Hover comment -->
  <rect x="80" y="495" width="540" height="50" rx="8" fill="#2D5016" fill-opacity="0.04"/>
  <use data-icon="tabler-filled/message-circle" x="95" y="505" width="20" height="20" fill="#4A7C28"/>
  <text x="120" y="525" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">
    快捷动作渲染为<tspan font-weight="bold">系统操作 chip</tspan>，不是伪装成用户消息
  </text>

  <!-- Offline fallback -->
  <rect x="80" y="555" width="540" height="36" rx="8" fill="#C45A28" fill-opacity="0.06"/>
  <text x="100" y="579" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C45A28">⚠ PlantEcho 此刻无法联网，回复来自本地预设</text>

  <!-- Right: Journal -->
  <text x="700" y="150" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#4A7C28">成长日记</text>

  <rect x="680" y="170" width="540" height="420" rx="12" fill="#FFFFFF"/>
  <rect x="680" y="170" width="540" height="420" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>

  <!-- StatCard area -->
  <text x="700" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">Bento StatCard</text>

  <rect x="700" y="215" width="120" height="60" rx="8" fill="#4A7C28" fill-opacity="0.08"/>
  <text x="760" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A7C28">15</text>
  <text x="760" y="262" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">天陪伴</text>

  <rect x="830" y="215" width="120" height="60" rx="8" fill="#E8A849" fill-opacity="0.08"/>
  <text x="890" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E8A849">3</text>
  <text x="890" y="262" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">次里程碑</text>

  <rect x="960" y="215" width="120" height="60" rx="8" fill="#D4A574" fill-opacity="0.08"/>
  <text x="1020" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#D4A574">12</text>
  <text x="1020" y="262" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">张照片</text>

  <!-- Milestone timeline -->
  <text x="700" y="310" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">里程碑时间线</text>

  <!-- Timeline line -->
  <line x1="730" y1="330" x2="730" y2="560" stroke="#E0D8C8" stroke-width="2"/>

  <!-- Milestone 1 -->
  <circle cx="730" cy="350" r="8" fill="#E8A849"/>
  <use data-icon="tabler-filled/star" x="722" y="342" width="16" height="16" fill="#FFFFFF"/>
  <text x="755" y="345" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">第一次发新芽</text>
  <text x="755" y="365" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">5月15日 · 你给它留了言</text>

  <!-- Milestone 2 -->
  <circle cx="730" cy="410" r="8" fill="#4A7C28"/>
  <use data-icon="tabler-filled/heart" x="722" y="402" width="16" height="16" fill="#FFFFFF"/>
  <text x="755" y="405" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">搬到了东窗边</text>
  <text x="755" y="425" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">5月20日 · 光照明显改善</text>

  <!-- Milestone 3 -->
  <circle cx="730" cy="470" r="8" fill="#D4A574"/>
  <use data-icon="tabler-filled/seedling" x="722" y="462" width="16" height="16" fill="#FFFFFF"/>
  <text x="755" y="465" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">连续7天健康</text>
  <text x="755" y="485" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">5月25日 · 系统自动庆祝</text>

  <!-- Hover to comment -->
  <rect x="755" y="500" width="200" height="28" rx="6" fill="#4A7C28" fill-opacity="0.06"/>
  <text x="770" y="519" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#4A7C28">hover 里程碑可直接留言</text>

  <!-- Bottom: Key insight -->
  <rect x="60" y="610" width="1160" height="60" rx="10" fill="#2D5016" fill-opacity="0.04"/>
  <use data-icon="tabler-filled/bulb" x="90" y="625" width="24" height="24" fill="#E8A849"/>
  <text x="125" y="647" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D5016">
    "看见"和"被看见"形成闭环 —— <tspan font-weight="bold" fill="#4A7C28">里程碑可被回应，让互动不只是单向</tspan>
  </text>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">12 / 18</text>
</svg>
