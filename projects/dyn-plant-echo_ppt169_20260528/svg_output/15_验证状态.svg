<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    验证状态
  </text>
  <text x="80" y="118" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#6B7B6B">
    全链路真实验证，不把未完成能力写成已完成
  </text>

  <!-- Verification grid -->
  <!-- Row 1 -->
  <!-- Backend tests -->
  <g id="ver-backend">
    <rect x="60" y="150" width="370" height="160" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="150" width="370" height="160" rx="12" fill="none" stroke="#4A7C28" stroke-width="1.5"/>
    <circle cx="105" cy="190" r="20" fill="#4A7C28" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/circle-check" x="89" y="174" width="32" height="32" fill="#4A7C28"/>
    <text x="140" y="195" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">后端测试</text>
    <rect x="280" y="172" width="130" height="28" rx="14" fill="#4A7C28" fill-opacity="0.12"/>
    <text x="345" y="191" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#4A7C28" font-weight="bold">全部通过</text>
    <text x="85" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#4A7C28">25</text>
    <text x="125" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7B6B">个测试用例</text>
    <text x="85" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">npm run test · 最近一次全部绿色</text>
    <text x="85" y="285" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">覆盖设备/植物/聊天/记忆/主动发言</text>
  </g>

  <!-- Retrieval evaluation -->
  <g id="ver-retrieval">
    <rect x="450" y="150" width="370" height="160" rx="12" fill="#FFFFFF"/>
    <rect x="450" y="150" width="370" height="160" rx="12" fill="none" stroke="#E8A849" stroke-width="1.5"/>
    <circle cx="495" cy="190" r="20" fill="#E8A849" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/circle-check" x="479" y="174" width="32" height="32" fill="#E8A849"/>
    <text x="530" y="195" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">检索评估</text>
    <rect x="670" y="172" width="130" height="28" rx="14" fill="#E8A849" fill-opacity="0.12"/>
    <text x="735" y="191" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#8B6914" font-weight="bold">100% 准确</text>
    <text x="475" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#E8A849">120</text>
    <text x="525" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#6B7B6B">条记忆 + 48 个查询</text>
    <text x="475" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">Top-1 / Top-3 / MRR 均 100%</text>
    <text x="475" y="285" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">Hybrid + Qwen3-Reranker-8B</text>
  </g>

  <!-- Docker deployment -->
  <g id="ver-docker">
    <rect x="840" y="150" width="380" height="160" rx="12" fill="#FFFFFF"/>
    <rect x="840" y="150" width="380" height="160" rx="12" fill="none" stroke="#D4A574" stroke-width="1.5"/>
    <circle cx="885" cy="190" r="20" fill="#D4A574" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/circle-check" x="869" y="174" width="32" height="32" fill="#D4A574"/>
    <text x="920" y="195" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">Docker 部署</text>
    <rect x="1060" y="172" width="140" height="28" rx="14" fill="#D4A574" fill-opacity="0.12"/>
    <text x="1130" y="191" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#8B6914" font-weight="bold">验证通过</text>
    <text x="865" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">本地镜像构建 + 容器验证</text>
    <text x="865" y="255" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">Docker Hub 推送完成</text>
    <text x="865" y="280" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">/health · 鉴权 · 认领 · 上报</text>
    <text x="865" y="300" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">2026-05-28 验证</text>
  </g>

  <!-- Row 2 -->
  <!-- Desktop client -->
  <g id="ver-desktop">
    <rect x="60" y="340" width="560" height="140" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="340" width="560" height="140" rx="12" fill="none" stroke="#4A7C28" stroke-width="1.5"/>
    <circle cx="105" cy="380" r="20" fill="#4A7C28" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/device-desktop" x="89" y="364" width="32" height="32" fill="#4A7C28"/>
    <text x="140" y="385" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">桌面客户端</text>
    <rect x="310" y="362" width="130" height="28" rx="14" fill="#4A7C28" fill-opacity="0.12"/>
    <text x="375" y="381" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#4A7C28" font-weight="bold">已构建</text>

    <use data-icon="tabler-filled/circle-check" x="85" y="405" width="18" height="18" fill="#4A7C28"/>
    <text x="110" y="422" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">Tauri v2.11.2 + Rust release</text>

    <use data-icon="tabler-filled/circle-check" x="85" y="430" width="18" height="18" fill="#4A7C28"/>
    <text x="110" y="447" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">msi + nsis 安装包产出</text>

    <use data-icon="tabler-filled/circle-check" x="85" y="455" width="18" height="18" fill="#4A7C28"/>
    <text x="110" y="472" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">多植物路由跳转统一编码</text>
  </g>

  <!-- ESP32 hardware -->
  <g id="ver-esp32">
    <rect x="640" y="340" width="580" height="140" rx="12" fill="#FFFFFF"/>
    <rect x="640" y="340" width="580" height="140" rx="12" fill="none" stroke="#E8A849" stroke-width="1.5"/>
    <circle cx="685" cy="380" r="20" fill="#E8A849" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/device-desktop" x="669" y="364" width="32" height="32" fill="#E8A849"/>
    <text x="720" y="385" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">ESP32 真实硬件</text>
    <rect x="900" y="362" width="130" height="28" rx="14" fill="#E8A849" fill-opacity="0.12"/>
    <text x="965" y="381" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#8B6914" font-weight="bold">实测通过</text>

    <use data-icon="tabler-filled/circle-check" x="665" y="405" width="18" height="18" fill="#4A7C28"/>
    <text x="690" y="422" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">OLED / SHT40 / GY-302 / 土壤 ADC 实测可用</text>

    <use data-icon="tabler-filled/circle-check" x="665" y="430" width="18" height="18" fill="#4A7C28"/>
    <text x="690" y="447" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">HTTP 上传 · MQTT 1秒级上报 · 断线重连</text>

    <use data-icon="tabler-filled/circle-check" x="665" y="455" width="18" height="18" fill="#4A7C28"/>
    <text x="690" y="472" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">SoftAP 配网 · OTA · 设备密钥自动接收</text>
  </g>

  <!-- Smoke test summary -->
  <rect x="60" y="510" width="1160" height="100" rx="12" fill="#2D5016" fill-opacity="0.04"/>
  <text x="80" y="540" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">Smoke 测试闭环</text>

  <g id="smoke-tests">
    <rect x="80" y="555" width="250" height="36" rx="8" fill="#4A7C28" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/circle-check" x="95" y="562" width="20" height="20" fill="#4A7C28"/>
    <text x="120" y="579" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">device-claim: unknown → claim → auth</text>

    <rect x="350" y="555" width="260" height="36" rx="8" fill="#E8A849" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/circle-check" x="365" y="562" width="20" height="20" fill="#E8A849"/>
    <text x="390" y="579" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#8B6914">memory-chat: 3轮对话生成长期记忆</text>

    <rect x="630" y="555" width="270" height="36" rx="8" fill="#D4A574" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/circle-check" x="645" y="562" width="20" height="20" fill="#D4A574"/>
    <text x="670" y="579" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#8B6914">memory-citation: 正确引用不过度</text>

    <rect x="920" y="555" width="250" height="36" rx="8" fill="#4A7C28" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/circle-check" x="935" y="562" width="20" height="20" fill="#4A7C28"/>
    <text x="960" y="579" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">rerank: Qwen3-Reranker-8B</text>
  </g>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">15 / 18</text>
</svg>
