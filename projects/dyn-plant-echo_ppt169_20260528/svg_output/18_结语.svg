<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5016"/>
      <stop offset="50%" stop-color="#3A6520"/>
      <stop offset="100%" stop-color="#4A7C28"/>
    </linearGradient>
    <radialGradient id="endGlow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#E8A849" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E8A849" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="endGlow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#6B9B37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6B9B37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#endBg)"/>
  <rect width="1280" height="720" fill="url(#endGlow1)"/>
  <rect width="1280" height="720" fill="url(#endGlow2)"/>

  <!-- Organic decorative circles -->
  <circle cx="200" cy="150" r="50" fill="#6B9B37" fill-opacity="0.08"/>
  <circle cx="270" cy="200" r="30" fill="#8BBF4A" fill-opacity="0.06"/>
  <circle cx="1050" cy="550" r="60" fill="#6B9B37" fill-opacity="0.07"/>
  <circle cx="1100" cy="500" r="35" fill="#8BBF4A" fill-opacity="0.05"/>

  <!-- Leaf decorations -->
  <g transform="translate(120, 250) rotate(-25)">
    <ellipse cx="0" cy="0" rx="8" ry="25" fill="#6B9B37" fill-opacity="0.1"/>
  </g>
  <g transform="translate(1160, 450) rotate(20)">
    <ellipse cx="0" cy="0" rx="10" ry="30" fill="#6B9B37" fill-opacity="0.08"/>
  </g>

  <!-- Heart icon -->
  <use data-icon="tabler-filled/heart" x="590" y="160" width="56" height="56" fill="#E8A849"/>

  <!-- Main message -->
  <text x="640" y="270" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">
    和植物一起呼吸
  </text>

  <!-- Divider -->
  <line x1="500" y1="300" x2="780" y2="300" stroke="#E8A849" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Philosophy -->
  <text x="640" y="345" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#D4E8C0">
    让每一株植物，都有被听见的权利
  </text>

  <text x="640" y="385" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#B8D4A0">
    不是高效的传感器看板，而是和植物一起呼吸的陪伴软件
  </text>

  <!-- Thank you -->
  <text x="640" y="460" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#E8A849">
    感谢聆听
  </text>

  <!-- Project info -->
  <rect x="380" y="500" width="520" height="120" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="640" y="535" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#D4E8C0">
    DYN Plant Echo · 智能植物陪伴系统
  </text>
  <text x="640" y="565" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#9BBF80">
    ESP32 · Node.js · Tauri · SQLite · LLM
  </text>
  <text x="640" y="595" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#9BBF80">
    2026年5月28日 · 期末汇报
  </text>

  <!-- Leaf icon bottom -->
  <use data-icon="tabler-filled/leaf" x="615" y="640" width="32" height="32" fill="#6B9B37" fill-opacity="0.4"/>

  <!-- Bottom decorative bar -->
  <rect x="0" y="700" width="1280" height="20" fill="#1A3A0E" fill-opacity="0.3"/>
</svg>
