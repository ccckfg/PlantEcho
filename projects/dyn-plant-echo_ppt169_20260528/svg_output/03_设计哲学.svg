<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    设计哲学：人文关怀
  </text>

  <!-- Five principle cards -->
  <!-- Card 1: 说人话 -->
  <g id="card-1">
    <rect x="60" y="140" width="220" height="250" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="140" width="220" height="250" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <circle cx="170" cy="190" r="24" fill="#4A7C28" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/message-circle" x="150" y="170" width="40" height="40" fill="#4A7C28"/>
    <text x="170" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">让系统说人话</text>
    <text x="170" y="268" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">把否定句翻译成邀请句</text>
    <line x1="100" y1="285" x2="240" y2="285" stroke="#E0D8C8" stroke-width="1"/>
    <text x="170" y="310" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">"我有点渴了·23%"</text>
    <text x="170" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">而非"水分:23%"</text>
    <text x="170" y="360" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C45A28" fill-opacity="0.7">❌ 拒绝冰冷的系统语言</text>
  </g>

  <!-- Card 2: 尊重节奏 -->
  <g id="card-2">
    <rect x="300" y="140" width="220" height="250" rx="12" fill="#FFFFFF"/>
    <rect x="300" y="140" width="220" height="250" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <circle cx="410" cy="190" r="24" fill="#E8A849" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/clock" x="390" y="170" width="40" height="40" fill="#E8A849"/>
    <text x="410" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">尊重用户的节奏</text>
    <text x="410" y="268" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">植物是慢的载体</text>
    <line x1="340" y1="285" x2="480" y2="285" stroke="#E0D8C8" stroke-width="1"/>
    <text x="410" y="310" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">5秒撤销 toast</text>
    <text x="410" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">380ms 缓动动画</text>
    <text x="410" y="360" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C45A28" fill-opacity="0.7">❌ 拒绝突然出现的弹窗</text>
  </g>

  <!-- Card 3: 操作信任 -->
  <g id="card-3">
    <rect x="540" y="140" width="220" height="250" rx="12" fill="#FFFFFF"/>
    <rect x="540" y="140" width="220" height="250" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <circle cx="650" cy="190" r="24" fill="#D4A574" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/shield-check" x="630" y="170" width="40" height="40" fill="#D4A574"/>
    <text x="650" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">操作信任</text>
    <text x="650" y="268" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">控制权还给用户</text>
    <line x1="580" y1="285" x2="720" y2="285" stroke="#E0D8C8" stroke-width="1"/>
    <text x="650" y="310" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">离线时诚实标注</text>
    <text x="650" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">未实现的按钮不放出</text>
    <text x="650" y="360" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C45A28" fill-opacity="0.7">❌ 拒绝伪造用户身份</text>
  </g>

  <!-- Card 4: 共情细节 -->
  <g id="card-4">
    <rect x="780" y="140" width="220" height="250" rx="12" fill="#FFFFFF"/>
    <rect x="780" y="140" width="220" height="250" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <circle cx="890" cy="190" r="24" fill="#4A7C28" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/heart" x="870" y="170" width="40" height="40" fill="#4A7C28"/>
    <text x="890" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">共情细节</text>
    <text x="890" y="268" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">让每个时刻被看见</text>
    <line x1="820" y1="285" x2="960" y2="285" stroke="#E0D8C8" stroke-width="1"/>
    <text x="890" y="310" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">时间感问候</text>
    <text x="890" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">里程碑可被回应</text>
    <text x="890" y="360" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C45A28" fill-opacity="0.7">❌ 拒绝空状态的冷漠</text>
  </g>

  <!-- Card 5: 呼吸感 -->
  <g id="card-5">
    <rect x="1020" y="140" width="200" height="250" rx="12" fill="#FFFFFF"/>
    <rect x="1020" y="140" width="200" height="250" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <circle cx="1120" cy="190" r="24" fill="#E8A849" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/leaf" x="1100" y="170" width="40" height="40" fill="#E8A849"/>
    <text x="1120" y="240" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">呼吸感</text>
    <text x="1120" y="268" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">视觉的节奏与韵律</text>
    <line x1="1050" y1="285" x2="1190" y2="285" stroke="#E0D8C8" stroke-width="1"/>
    <text x="1120" y="310" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">渐变遮罩柔化边界</text>
    <text x="1120" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">滚动条柔和显现</text>
    <text x="1120" y="360" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C45A28" fill-opacity="0.7">❌ 拒绝硬线切割</text>
  </g>

  <!-- Bottom summary bar -->
  <rect x="60" y="430" width="1160" height="80" rx="12" fill="#2D5016" fill-opacity="0.06"/>
  <use data-icon="tabler-filled/bulb" x="90" y="448" width="32" height="32" fill="#E8A849"/>
  <text x="140" y="468" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#2D5016" font-weight="bold">
    设计原则总纲
  </text>
  <text x="140" y="495" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#6B7B6B">
    所有用户可见文案都遵循「人文关怀」五原则：<tspan fill="#4A7C28" font-weight="bold">植物视角 · 撤销优先 · 诚实优先 · 共情细节 · 呼吸感动效</tspan>
  </text>

  <!-- Bottom anti-patterns -->
  <text x="80" y="560" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">
    应避免的反模式
  </text>

  <g id="anti-patterns">
    <rect x="80" y="580" width="260" height="50" rx="8" fill="#C45A28" fill-opacity="0.06"/>
    <text x="100" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C45A28">❌ 用红色/感叹号否定用户</text>

    <rect x="360" y="580" width="260" height="50" rx="8" fill="#C45A28" fill-opacity="0.06"/>
    <text x="380" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C45A28">❌ 用户阅读时弹 modal 抢焦点</text>

    <rect x="640" y="580" width="260" height="50" rx="8" fill="#C45A28" fill-opacity="0.06"/>
    <text x="660" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C45A28">❌ 系统写入"用户消息"</text>

    <rect x="920" y="580" width="260" height="50" rx="8" fill="#C45A28" fill-opacity="0.06"/>
    <text x="940" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C45A28">❌ 无撤销路径的破坏性操作</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="1200" cy="80" r="15" fill="#4A7C28" fill-opacity="0.06"/>
  <circle cx="50" cy="680" r="12" fill="#E8A849" fill-opacity="0.08"/>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">03 / 18</text>
</svg>
