<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    完成度总览
  </text>

  <!-- Progress bars -->
  <!-- Backend overall -->
  <g id="prog-backend">
    <rect x="60" y="140" width="1160" height="80" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="140" width="1160" height="80" rx="12" fill="none" stroke="#4A7C28" stroke-width="1.5"/>
    <text x="90" y="172" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">整体后端</text>
    <text x="90" y="198" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">Node.js + TypeScript + Fastify + SQLite</text>
    <!-- Progress bar background -->
    <rect x="350" y="168" width="700" height="24" rx="12" fill="#E0D8C8"/>
    <!-- Progress bar fill -->
    <rect x="350" y="168" width="630" height="24" rx="12" fill="#4A7C28"/>
    <!-- Percentage -->
    <text x="1080" y="187" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A7C28">~90%</text>
  </g>

  <!-- Desktop client -->
  <g id="prog-desktop">
    <rect x="60" y="240" width="1160" height="80" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="240" width="1160" height="80" rx="12" fill="none" stroke="#E8A849" stroke-width="1.5"/>
    <text x="90" y="272" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">桌面客户端</text>
    <text x="90" y="298" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">Tauri v2 + React 18 + Vite 5 + TypeScript</text>
    <rect x="350" y="268" width="700" height="24" rx="12" fill="#E0D8C8"/>
    <rect x="350" y="268" width="609" height="24" rx="12" fill="#E8A849"/>
    <text x="1080" y="287" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E8A849">~87%</text>
  </g>

  <!-- Hardware -->
  <g id="prog-hardware">
    <rect x="60" y="340" width="1160" height="80" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="340" width="1160" height="80" rx="12" fill="none" stroke="#D4A574" stroke-width="1.5"/>
    <text x="90" y="372" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">硬件数据接入</text>
    <text x="90" y="398" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">ESP32 + MQTT + SoftAP + OTA</text>
    <rect x="350" y="368" width="700" height="24" rx="12" fill="#E0D8C8"/>
    <rect x="350" y="368" width="644" height="24" rx="12" fill="#D4A574"/>
    <text x="1080" y="387" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#D4A574">92%</text>
  </g>

  <!-- Memory system -->
  <g id="prog-memory">
    <rect x="60" y="440" width="1160" height="80" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="440" width="1160" height="80" rx="12" fill="none" stroke="#4A7C28" stroke-width="1.5"/>
    <text x="90" y="472" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">记忆系统架构</text>
    <text x="90" y="498" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">AgentGal 生命周期 + 混合检索 + Rerank</text>
    <rect x="350" y="468" width="700" height="24" rx="12" fill="#E0D8C8"/>
    <rect x="350" y="468" width="595" height="24" rx="12" fill="#4A7C28"/>
    <text x="1080" y="487" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A7C28">85%</text>
  </g>

  <!-- Design -->
  <g id="prog-design">
    <rect x="60" y="540" width="1160" height="80" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="540" width="1160" height="80" rx="12" fill="none" stroke="#E8A849" stroke-width="1.5"/>
    <text x="90" y="572" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">设计稿落地</text>
    <text x="90" y="598" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">Verdant Echo · 5 页完整设计 · 人文关怀五原则</text>
    <rect x="350" y="568" width="700" height="24" rx="12" fill="#E0D8C8"/>
    <rect x="350" y="568" width="700" height="24" rx="12" fill="#E8A849"/>
    <text x="1080" y="587" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E8A849">100%</text>
  </g>

  <!-- Summary bar -->
  <rect x="60" y="640" width="1160" height="50" rx="10" fill="#2D5016" fill-opacity="0.06"/>
  <text x="640" y="672" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D5016">
    <tspan font-weight="bold">MVP 阶段完成度高</tspan> · 核心功能闭环 · 全链路真实验证
  </text>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">16 / 18</text>
</svg>
