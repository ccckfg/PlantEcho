<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    记忆召回与引用策略
  </text>

  <!-- Left: Citation policy -->
  <text x="80" y="150" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#4A7C28">智能引用策略</text>

  <!-- Policy card 1 -->
  <g id="policy-1">
    <rect x="60" y="170" width="560" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="170" width="560" height="80" rx="10" fill="none" stroke="#4A7C28" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="100" cy="210" r="18" fill="#4A7C28" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/chart-bar" x="86" y="196" width="28" height="28" fill="#4A7C28"/>
    <text x="130" y="205" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">状态/读数类问题</text>
    <text x="130" y="228" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">优先回答<tspan font-weight="bold" fill="#4A7C28">当前传感器数据</tspan>，不主动引用旧记忆</text>
  </g>

  <!-- Policy card 2 -->
  <g id="policy-2">
    <rect x="60" y="265" width="560" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="265" width="560" height="80" rx="10" fill="none" stroke="#E8A849" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="100" cy="305" r="18" fill="#E8A849" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/book" x="86" y="291" width="28" height="28" fill="#E8A849"/>
    <text x="130" y="300" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">明确问"记得/上次"</text>
    <text x="130" y="323" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">允许引用<tspan font-weight="bold" fill="#E8A849">中高相关</tspan>的记忆</text>
  </g>

  <!-- Policy card 3 -->
  <g id="policy-3">
    <rect x="60" y="360" width="560" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="360" width="560" height="80" rx="10" fill="none" stroke="#D4A574" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="100" cy="400" r="18" fill="#D4A574" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/star" x="86" y="386" width="28" height="28" fill="#D4A574"/>
    <text x="130" y="395" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">高相关记忆</text>
    <text x="130" y="418" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">最多引用<tspan font-weight="bold" fill="#D4A574">1 条</tspan>，且能帮助回答时才引用</text>
  </g>

  <!-- Policy card 4: Honesty -->
  <g id="policy-4">
    <rect x="60" y="455" width="560" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="455" width="560" height="80" rx="10" fill="none" stroke="#C45A28" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="100" cy="495" r="18" fill="#C45A28" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/shield-check" x="86" y="481" width="28" height="28" fill="#C45A28"/>
    <text x="130" y="490" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C45A28">诚实优先</text>
    <text x="130" y="513" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">没有可靠记忆时，<tspan font-weight="bold" fill="#C45A28">禁止说"我记得"</tspan></text>
  </g>

  <!-- Right: Citation example -->
  <text x="700" y="150" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#4A7C28">引用返回格式</text>

  <rect x="680" y="170" width="540" height="200" rx="12" fill="#FFFFFF"/>
  <rect x="680" y="170" width="540" height="200" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
  <text x="700" y="200" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">"usedMemoryIds": ["..."],</text>
  <text x="700" y="222" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">"memoryCitations": [</text>
  <text x="720" y="244" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A7C28">  "id": "abc123",</text>
  <text x="720" y="266" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#E8A849">  "title": "从客厅搬到了东窗边",</text>
  <text x="720" y="288" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#D4A574">  "date": "2026-05-20",</text>
  <text x="720" y="310" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#6B7B6B">  "relevance": 0.91</text>
  <text x="700" y="332" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">  }</text>
  <text x="700" y="354" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">]</text>

  <!-- Right: Recall query construction -->
  <text x="700" y="410" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#4A7C28">召回查询构造</text>

  <rect x="680" y="430" width="540" height="130" rx="12" fill="#FFFFFF"/>
  <rect x="680" y="430" width="540" height="130" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
  <text x="700" y="460" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">Episode 语义查询</text>
  <text x="700" y="482" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="11" fill="#6B7B6B">传感器场景 + 最近对话 + 当前关注点 + 主人新消息</text>
  <text x="700" y="510" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">Understanding 语义查询</text>
  <text x="700" y="532" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="11" fill="#6B7B6B">关系摘要 + 当前关注点 + 最近对话 + 主人新消息</text>

  <!-- Right: Smoke test result -->
  <rect x="680" y="580" width="540" height="70" rx="10" fill="#4A7C28" fill-opacity="0.06"/>
  <use data-icon="tabler-filled/circle-check" x="700" y="593" width="28" height="28" fill="#4A7C28"/>
  <text x="740" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A7C28">smoke:memory-citation 通过</text>
  <text x="740" y="633" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">直接记忆问题返回 citations，状态/读数问题不过度引用</text>

  <!-- Decorative -->
  <circle cx="1200" cy="100" r="15" fill="#4A7C28" fill-opacity="0.06"/>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">08 / 18</text>
</svg>
