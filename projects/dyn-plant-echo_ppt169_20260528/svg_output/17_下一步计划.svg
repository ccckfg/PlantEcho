    <rect x="875" y="545" width="150" height="30" rx="6" fill="#E8A849" fill-opacity="0.08"/>
    <text x="950" y="565" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">相册编辑功能</text>

    <rect x="1040" y="545" width="150" height="30" rx="6" fill="#D4A574" fill-opacity="0.08"/>
    <text x="1115" y="565" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">多用户体系</text>
