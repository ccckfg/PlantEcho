<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    硬件层：ESP32 智能感知
  </text>

  <!-- Left: Sensor cards -->
  <text x="80" y="150" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#4A7C28">传感器模块</text>

  <!-- Sensor 1: SHT40 -->
  <g id="sensor-sht40">
    <rect x="60" y="170" width="260" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="170" width="260" height="100" rx="10" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <use data-icon="tabler-filled/temperature-plus" x="80" y="188" width="36" height="36" fill="#E8A849"/>
    <text x="130" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">SHT40</text>
    <text x="130" y="232" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">温湿度传感器 · I2C 0x44</text>
    <text x="130" y="254" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9B8B7B">airTempC · airHumidityPercent</text>
  </g>

  <!-- Sensor 2: BH1750 -->
  <g id="sensor-bh1750">
    <rect x="60" y="285" width="260" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="285" width="260" height="100" rx="10" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <use data-icon="tabler-filled/sun-high" x="80" y="303" width="36" height="36" fill="#E8A849"/>
    <text x="130" y="325" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">BH1750</text>
    <text x="130" y="347" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">光照传感器 · I2C 0x23</text>
    <text x="130" y="369" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9B8B7B">lightLux</text>
  </g>

  <!-- Sensor 3: Soil Moisture -->
  <g id="sensor-soil">
    <rect x="60" y="400" width="260" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="400" width="260" height="100" rx="10" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <use data-icon="tabler-filled/droplet" x="80" y="418" width="36" height="36" fill="#4A7C28"/>
    <text x="130" y="440" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">电容式土壤湿度</text>
    <text x="130" y="462" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">GPIO34 / ADC</text>
    <text x="130" y="484" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#9B8B7B">soilRaw · soilPercent</text>
  </g>

  <!-- Sensor 4: OLED -->
  <g id="sensor-oled">
    <rect x="60" y="515" width="260" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="60" y="515" width="260" height="80" rx="10" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <use data-icon="tabler-filled/device-desktop" x="80" y="530" width="36" height="36" fill="#2D5016"/>
    <text x="130" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">OLED 显示屏</text>
    <text x="130" y="574" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">I2C 0x3C</text>
  </g>

  <!-- Right: Capabilities -->
  <text x="700" y="150" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#4A7C28">核心能力</text>

  <!-- Capability 1: SoftAP -->
  <g id="cap-softap">
    <rect x="380" y="170" width="380" height="120" rx="10" fill="#FFFFFF"/>
    <rect x="380" y="170" width="380" height="120" rx="10" fill="none" stroke="#4A7C28" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="420" cy="210" r="20" fill="#4A7C28" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/globe" x="404" y="194" width="32" height="32" fill="#4A7C28"/>
    <text x="450" y="208" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">SoftAP 配网</text>
    <text x="450" y="232" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">长按 BOOT 键 3 秒进入配网模式</text>
    <text x="450" y="256" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">Wi-Fi · MQTT · HTTP · 设备 ID · OTA</text>
    <text x="450" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">配置写入 NVS 持久化</text>
  </g>

  <!-- Capability 2: MQTT -->
  <g id="cap-mqtt">
    <rect x="380" y="305" width="380" height="120" rx="10" fill="#FFFFFF"/>
    <rect x="380" y="305" width="380" height="120" rx="10" fill="none" stroke="#E8A849" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="420" cy="345" r="20" fill="#E8A849" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/cloud" x="404" y="329" width="32" height="32" fill="#E8A849"/>
    <text x="450" y="343" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">MQTT 上报</text>
    <text x="450" y="367" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">Topic: dyn/devices/:deviceId/readings</text>
    <text x="450" y="391" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">1秒级上报 · 断线自动重连</text>
    <text x="450" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">设备密钥可通过 MQTT 自动下发</text>
  </g>

  <!-- Capability 3: OTA -->
  <g id="cap-ota">
    <rect x="380" y="440" width="380" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="380" y="440" width="380" height="100" rx="10" fill="none" stroke="#D4A574" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="420" cy="475" r="20" fill="#D4A574" fill-opacity="0.1"/>
    <use data-icon="tabler-filled/bolt" x="404" y="459" width="32" height="32" fill="#D4A574"/>
    <text x="450" y="473" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">OTA 在线更新</text>
    <text x="450" y="497" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">Manifest: {"version":"0.2.1","url":"firmware.bin"}</text>
    <text x="450" y="521" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9B8B7B">仅支持 2.4GHz Wi-Fi</text>
  </g>

  <!-- Right side: Architecture diagram -->
  <g id="arch-diagram">
    <rect x="820" y="170" width="400" height="420" rx="12" fill="#FFFFFF"/>
    <rect x="820" y="170" width="400" height="420" rx="12" fill="none" stroke="#E0D8C8" stroke-width="1"/>
    <text x="1020" y="200" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">数据流架构</text>

    <!-- ESP32 block -->
    <rect x="860" y="220" width="320" height="50" rx="8" fill="#4A7C28" fill-opacity="0.1"/>
    <text x="1020" y="250" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">ESP32 采集层</text>

    <!-- Arrow down -->
    <line x1="1020" y1="270" x2="1020" y2="300" stroke="#4A7C28" stroke-width="2"/>
    <polygon points="1020,300 1014,290 1026,290" fill="#4A7C28"/>

    <!-- Data block -->
    <rect x="860" y="305" width="320" height="50" rx="8" fill="#E8A849" fill-opacity="0.1"/>
    <text x="1020" y="335" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B6914">传感器数据</text>

    <!-- Arrow down -->
    <line x1="1020" y1="355" x2="1020" y2="385" stroke="#E8A849" stroke-width="2"/>
    <polygon points="1020,385 1014,375 1026,375" fill="#E8A849"/>

    <!-- Protocol block -->
    <rect x="860" y="390" width="150" height="50" rx="8" fill="#2D5016" fill-opacity="0.08"/>
    <text x="935" y="420" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">MQTT</text>

    <rect x="1030" y="390" width="150" height="50" rx="8" fill="#2D5016" fill-opacity="0.08"/>
    <text x="1105" y="420" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">HTTP</text>

    <!-- Arrow down -->
    <line x1="1020" y1="440" x2="1020" y2="470" stroke="#2D5016" stroke-width="2"/>
    <polygon points="1020,470 1014,460 1026,460" fill="#2D5016"/>

    <!-- Server block -->
    <rect x="860" y="475" width="320" height="50" rx="8" fill="#2D5016" fill-opacity="0.1"/>
    <text x="1020" y="505" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">后端服务接收</text>

    <!-- MQTT topic label -->
    <rect x="850" y="545" width="340" height="30" rx="6" fill="#F5F0E8"/>
    <text x="1020" y="566" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="11" fill="#6B7B6B">dyn/devices/:deviceId/readings</text>
  </g>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">05 / 18</text>
</svg>
