    <rect x="880" y="155" width="340" height="480" rx="16" fill="#FFFFFF"/>
    <rect x="880" y="155" width="340" height="480" rx="16" fill="none" stroke="#E8A849" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Header -->
    <rect x="880" y="155" width="340" height="50" rx="16" fill="#E8A849"/>
    <rect x="880" y="190" width="340" height="15" fill="#E8A849"/>
    <use data-icon="tabler-filled/home-2" x="900" y="163" width="32" height="32" fill="#FFFFFF"/>
    <text x="940" y="187" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">客户端层</text>

    <!-- Tech stack -->
    <rect x="910" y="225" width="280" height="36" rx="6" fill="#E8A849" fill-opacity="0.08"/>
