    <rect x="510" y="305" width="120" height="34" rx="6" fill="#4A7C28" fill-opacity="0.1"/>
    <text x="570" y="328" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">设备管理</text>

    <rect x="640" y="305" width="120" height="34" rx="6" fill="#4A7C28" fill-opacity="0.1"/>
    <text x="700" y="328" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">植物档案</text>

    <rect x="510" y="348" width="120" height="34" rx="6" fill="#E8A849" fill-opacity="0.1"/>
    <text x="570" y="371" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">聊天引擎</text>

    <rect x="640" y="348" width="120" height="34" rx="6" fill="#E8A849" fill-opacity="0.1"/>
    <text x="700" y="371" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">记忆系统</text>

    <rect x="510" y="391" width="120" height="34" rx="6" fill="#D4A574" fill-opacity="0.1"/>
    <text x="570" y="414" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">主动发言</text>

    <rect x="640" y="391" width="120" height="34" rx="6" fill="#D4A574" fill-opacity="0.1"/>
    <text x="700" y="414" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">实时同步</text>

    <rect x="510" y="434" width="120" height="34" rx="6" fill="#4A7C28" fill-opacity="0.06"/>
    <text x="570" y="457" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">天气服务</text>

    <rect x="640" y="434" width="120" height="34" rx="6" fill="#4A7C28" fill-opacity="0.06"/>
    <text x="700" y="457" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">访问鉴权</text>

    <!-- Storage -->
    <text x="640" y="500" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">存储层</text>
    <rect x="510" y="515" width="260" height="30" rx="6" fill="#2D5016" fill-opacity="0.04"/>
    <text x="640" y="536" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4A7C28">SQLite + sqlite-vec + FTS5</text>

    <text x="640" y="575" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">校验层</text>
    <rect x="510" y="590" width="260" height="30" rx="6" fill="#2D5016" fill-opacity="0.04"/>
    <text x="640" y="611" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4A7C28">Zod Schema Validation</text>
  </g>

  <!-- Arrow 2: Server to Client -->
  <g id="arrow-server-client">
    <line x1="810" y1="350" x2="870" y2="350" stroke="#2D5016" stroke-width="2"/>
    <polygon points="870,350 860,344 860,356" fill="#2D5016"/>
    <text x="840" y="338" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">SSE</text>
    <text x="840" y="370" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">REST API</text>
  </g>

