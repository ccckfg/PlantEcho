<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    系统全景架构
  </text>
  <text x="80" y="118" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#6B7B6B">
    硬件层 → 服务端层 → 客户端层
  </text>

  <!-- Three-layer architecture -->

  <!-- Layer 1: Hardware -->
  <g id="layer-hardware">
    <rect x="60" y="155" width="340" height="480" rx="16" fill="#FFFFFF"/>
    <rect x="60" y="155" width="340" height="480" rx="16" fill="none" stroke="#4A7C28" stroke-width="2" stroke-opacity="0.3"/>
    <!-- Header -->
    <rect x="60" y="155" width="340" height="50" rx="16" fill="#4A7C28"/>
    <rect x="60" y="190" width="340" height="15" fill="#4A7C28"/>
    <use data-icon="tabler-filled/device-desktop" x="80" y="163" width="32" height="32" fill="#FFFFFF"/>
    <text x="120" y="187" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">硬件层</text>

    <!-- ESP32 -->
    <rect x="90" y="225" width="280" height="44" rx="8" fill="#4A7C28" fill-opacity="0.08"/>
    <text x="230" y="253" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">ESP32 核心控制器</text>

    <!-- Sensors -->
    <text x="230" y="295" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7C28">传感器模块</text>

    <rect x="90" y="310" width="130" height="36" rx="6" fill="#F5F0E8"/>
    <text x="155" y="334" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2B2B2B">SHT40 温湿度</text>

    <rect x="230" y="310" width="130" height="36" rx="6" fill="#F5F0E8"/>
    <text x="295" y="334" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2B2B2B">BH1750 光照</text>

    <rect x="90" y="355" width="130" height="36" rx="6" fill="#F5F0E8"/>
    <text x="155" y="379" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2B2B2B">土壤湿度 ADC</text>

    <rect x="230" y="355" width="130" height="36" rx="6" fill="#F5F0E8"/>
    <text x="295" y="379" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2B2B2B">OLED 显示屏</text>

    <!-- Capabilities -->
    <text x="230" y="420" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7C28">核心能力</text>

    <rect x="90" y="435" width="85" height="32" rx="6" fill="#E8A849" fill-opacity="0.12"/>
    <text x="132" y="457" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#E8A849" font-weight="bold">SoftAP</text>

    <rect x="185" y="435" width="85" height="32" rx="6" fill="#E8A849" fill-opacity="0.12"/>
    <text x="227" y="457" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#E8A849" font-weight="bold">MQTT</text>

    <rect x="280" y="435" width="85" height="32" rx="6" fill="#E8A849" fill-opacity="0.12"/>
    <text x="322" y="457" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#E8A849" font-weight="bold">OTA</text>

    <!-- Data types -->
    <text x="230" y="500" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">上报数据</text>
    <text x="230" y="522" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="11" fill="#9B8B7B">soilRaw · soilPercent</text>
    <text x="230" y="540" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="11" fill="#9B8B7B">airTempC · airHumidity</text>
    <text x="230" y="558" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="11" fill="#9B8B7B">lightLux</text>
  </g>

  <!-- Arrow 1: Hardware to Server -->
  <g id="arrow-hw-server">
    <line x1="410" y1="390" x2="470" y2="390" stroke="#4A7C28" stroke-width="2"/>
    <polygon points="470,390 460,384 460,396" fill="#4A7C28"/>
    <text x="440" y="378" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">MQTT</text>
    <text x="440" y="410" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#6B7B6B">HTTP</text>
  </g>

  <!-- Layer 2: Server -->
  <g id="layer-server">
    <rect x="480" y="155" width="320" height="480" rx="16" fill="#FFFFFF"/>
    <rect x="480" y="155" width="320" height="480" rx="16" fill="none" stroke="#2D5016" stroke-width="2" stroke-opacity="0.4"/>
