    <!-- Tech stack -->
    <rect x="510" y="225" width="260" height="36" rx="6" fill="#2D5016" fill-opacity="0.06"/>
    <text x="640" y="249" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2D5016">Node.js 24 + TypeScript + Fastify</text>

    <!-- Modules grid -->
