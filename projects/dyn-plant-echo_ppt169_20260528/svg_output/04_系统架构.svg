    <rect x="910" y="305" width="130" height="50" rx="8" fill="#4A7C28" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/home-2" x="925" y="312" width="24" height="24" fill="#4A7C28"/>
    <text x="990" y="336" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">温室 Dashboard</text>

    <rect x="1050" y="305" width="130" height="50" rx="8" fill="#E8A849" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/leaf" x="1065" y="312" width="24" height="24" fill="#E8A849"/>
    <text x="1130" y="336" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">植物详情</text>

    <rect x="910" y="365" width="130" height="50" rx="8" fill="#D4A574" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/message-circle" x="925" y="372" width="24" height="24" fill="#D4A574"/>
    <text x="990" y="396" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">植响对话</text>

    <rect x="1050" y="365" width="130" height="50" rx="8" fill="#4A7C28" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/book" x="1065" y="372" width="24" height="24" fill="#4A7C28"/>
    <text x="1130" y="396" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">成长日记</text>

    <rect x="910" y="425" width="270" height="50" rx="8" fill="#E8A849" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/camera" x="925" y="432" width="24" height="24" fill="#E8A849"/>
    <text x="1060" y="456" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2D5016">相册管理</text>

    <!-- Design system -->
    <text x="1050" y="510" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">设计系统</text>
    <rect x="910" y="525" width="270" height="30" rx="6" fill="#E8A849" fill-opacity="0.06"/>
    <text x="1050" y="546" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">Verdant Echo · Forest-to-Soil</text>

    <text x="1050" y="585" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6B7B6B">核心机制</text>
    <rect x="910" y="600" width="130" height="26" rx="6" fill="#2D5016" fill-opacity="0.06"/>
    <text x="975" y="618" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#2D5016">SSE 实时同步</text>
    <rect x="1050" y="600" width="130" height="26" rx="6" fill="#2D5016" fill-opacity="0.06"/>
    <text x="1115" y="618" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#2D5016">Toast Undo</text>
  </g>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">04 / 18</text>
</svg>
