<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F5F0E8"/>

  <!-- Top decorative bar -->
  <rect x="60" y="50" width="4" height="60" rx="2" fill="#4A7C28"/>

  <!-- Page title -->
  <text x="80" y="88" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#2D5016">
    主动发言引擎
  </text>
  <text x="80" y="118" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#6B7B6B">
    让植物不只被动回答，还能主动关心主人
  </text>

  <!-- Three trigger cards -->
  <!-- Trigger 1: Sensor -->
  <g id="trigger-sensor">
    <rect x="60" y="150" width="360" height="180" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="150" width="360" height="180" rx="12" fill="none" stroke="#4A7C28" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="100" cy="185" r="20" fill="#4A7C28" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/droplet" x="84" y="169" width="32" height="32" fill="#4A7C28"/>
    <text x="130" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">传感器异常</text>
    <rect x="280" y="170" width="120" height="26" rx="13" fill="#4A7C28" fill-opacity="0.1"/>
    <text x="340" y="188" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#4A7C28" font-weight="bold">最高优先级</text>
    <text x="80" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">1. soil_low — "我有点渴了"</text>
    <text x="80" y="242" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">2. sensor_offline — 离线提醒</text>
    <text x="80" y="264" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">3. 过湿/温度/光照异常</text>
    <text x="80" y="295" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">冷却: 30分钟 · 离线: 12小时</text>
  </g>

  <!-- Trigger 2: Weather -->
  <g id="trigger-weather">
    <rect x="440" y="150" width="360" height="180" rx="12" fill="#FFFFFF"/>
    <rect x="440" y="150" width="360" height="180" rx="12" fill="none" stroke="#E8A849" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="480" cy="185" r="20" fill="#E8A849" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/cloud" x="464" y="169" width="32" height="32" fill="#E8A849"/>
    <text x="510" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">天气提醒</text>
    <text x="460" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">检测到下雨或降水</text>
    <text x="460" y="242" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">自动提醒主人带伞</text>
    <text x="460" y="264" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">每个植物各发一条</text>
    <text x="460" y="295" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">冷却: 6小时 · 未配置时安静跳过</text>
  </g>

  <!-- Trigger 3: Reminder -->
  <g id="trigger-reminder">
    <rect x="820" y="150" width="400" height="180" rx="12" fill="#FFFFFF"/>
    <rect x="820" y="150" width="400" height="180" rx="12" fill="none" stroke="#D4A574" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="860" cy="185" r="20" fill="#D4A574" fill-opacity="0.12"/>
    <use data-icon="tabler-filled/calendar" x="844" y="169" width="32" height="32" fill="#D4A574"/>
    <text x="890" y="190" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D5016">用户提醒</text>
    <text x="840" y="220" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">"十分钟后提醒我浇水"</text>
    <text x="840" y="242" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">"明天早上8点提醒我带伞"</text>
    <text x="840" y="264" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">规则解析中文时间表达</text>
    <text x="840" y="295" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">最长跨度: 30天 · background_jobs 持久化</text>
  </g>

  <!-- Data flow -->
  <text x="80" y="370" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2D5016">数据流</text>

  <g id="dataflow">
    <!-- Event source -->
    <rect x="60" y="395" width="160" height="50" rx="8" fill="#4A7C28" fill-opacity="0.1"/>
    <text x="140" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">事件触发</text>

    <line x1="225" y1="420" x2="265" y2="420" stroke="#4A7C28" stroke-width="1.5"/>
    <polygon points="265,420 259,415 261,425" fill="#4A7C28"/>

    <!-- Evaluate -->
    <rect x="270" y="395" width="160" height="50" rx="8" fill="#E8A849" fill-opacity="0.1"/>
    <text x="350" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B6914">evaluateReading</text>

    <line x1="435" y1="420" x2="475" y2="420" stroke="#E8A849" stroke-width="1.5"/>
    <polygon points="475,420 469,415 471,425" fill="#E8A849"/>

    <!-- Trigger -->
    <rect x="480" y="395" width="160" height="50" rx="8" fill="#D4A574" fill-opacity="0.1"/>
    <text x="560" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B6914">sensorTriggers</text>

    <line x1="645" y1="420" x2="685" y2="420" stroke="#D4A574" stroke-width="1.5"/>
    <polygon points="685,420 679,415 681,425" fill="#D4A574"/>

    <!-- Cooldown -->
    <rect x="690" y="395" width="160" height="50" rx="8" fill="#C45A28" fill-opacity="0.08"/>
    <text x="770" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C45A28">冷却去重</text>

    <line x1="855" y1="420" x2="895" y2="420" stroke="#C45A28" stroke-width="1.5"/>
    <polygon points="895,420 889,415 891,425" fill="#C45A28"/>

    <!-- LLM compose -->
    <rect x="900" y="395" width="160" height="50" rx="8" fill="#2D5016" fill-opacity="0.1"/>
    <text x="980" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D5016">LLM 润色</text>

    <line x1="1065" y1="420" x2="1105" y2="420" stroke="#2D5016" stroke-width="1.5"/>
    <polygon points="1105,420 1099,415 1101,425" fill="#2D5016"/>

    <!-- Output -->
    <rect x="1110" y="395" width="110" height="50" rx="8" fill="#4A7C28" fill-opacity="0.15"/>
    <text x="1165" y="425" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A7C28">发言</text>
  </g>

  <!-- Output destinations -->
  <g id="outputs">
    <line x1="1165" y1="445" x2="1165" y2="475" stroke="#4A7C28" stroke-width="1.5"/>
    <polygon points="1165,475 1160,465 1170,465" fill="#4A7C28"/>

    <rect x="1050" y="480" width="100" height="36" rx="6" fill="#4A7C28" fill-opacity="0.08"/>
    <text x="1100" y="504" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#2D5016">messages</text>

    <rect x="1160" y="480" width="100" height="36" rx="6" fill="#E8A849" fill-opacity="0.08"/>
    <text x="1210" y="504" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#8B6914">sync_events</text>
  </g>

  <!-- Key insight -->
  <rect x="60" y="540" width="1160" height="80" rx="12" fill="#2D5016" fill-opacity="0.04"/>
  <use data-icon="tabler-filled/bulb" x="90" y="558" width="28" height="28" fill="#E8A849"/>
  <text x="130" y="578" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D5016">设计亮点</text>
  <text x="130" y="603" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#6B7B6B">
    事件只决定"该不该说"和"事实是什么"；<tspan font-weight="bold" fill="#4A7C28">LLM 只负责把结构化事实润色成植物口吻的一句话</tspan>
  </text>

  <!-- Example proactive message -->
  <rect x="60" y="630" width="560" height="50" rx="10" fill="#FFFFFF"/>
  <rect x="60" y="630" width="560" height="50" rx="10" fill="none" stroke="#E0D8C8" stroke-width="1"/>
  <use data-icon="tabler-filled/leaf" x="80" y="640" width="28" height="28" fill="#4A7C28"/>
  <text x="120" y="662" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D5016" font-style="italic">
    "今天外面下雨了，记得带伞哦～我会乖乖待在家里的"
  </text>

  <!-- Page number -->
  <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#9B8B7B">09 / 18</text>
</svg>
