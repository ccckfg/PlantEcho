    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="710" y="490"><tspan>✅ <tspan fill="#1C2E24" font-weight="bold">全栈完全落成</tspan>：后端完成度约 <tspan fill="#2B583E" font-weight="bold">90%</tspan>，客户端 <tspan fill="#2B583E" font-weight="bold">87%</tspan>。</tspan>
