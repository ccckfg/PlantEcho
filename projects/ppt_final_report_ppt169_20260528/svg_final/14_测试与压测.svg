<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#F4F6F4" />

  
  <g id="header-group">
    <path fill="#2B583E" fill-opacity="0.08" d="M73,40 H167 A13,13 0 0 1 180,53 V53 A13,13 0 0 1 167,66 H73 A13,13 0 0 1 60,53 V53 A13,13 0 0 1 73,40 Z" />
    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">验证与质量层</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">严谨的技术保障：全面的单元测试与链路压测</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  
  
  <g id="kpi-card-1">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M72,125 H308 A12,12 0 0 1 320,137 V573 A12,12 0 0 1 308,585 H72 A12,12 0 0 1 60,573 V137 A12,12 0 0 1 72,125 Z" />
    <path d="M 60,137 A 12,12 0 0,1 72,125 L 308,125 A 12,12 0 0,1 320,137 L 320,140 L 60,140 Z" fill="#2B583E" />

    
    <text x="190" y="210" font-family="Quicksand, sans-serif" font-size="42" font-weight="bold" fill="#2B583E" text-anchor="middle">25 +</text>
    <text x="190" y="240" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#809085" text-anchor="middle">Fastify 后端测试用例</text>
    <line x1="90" y1="260" x2="290" y2="260" stroke="#D1DAD4" stroke-width="1" />

    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="85" y="300"><tspan>· <tspan fill="#1C2E24" font-weight="bold">测试套件全覆盖</tspan>：后端核心</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="85" y="324">  路由、输入 schema 校验、设备</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="85" y="348">  认领逻辑单元测试通过率100%。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="85" y="376"><tspan>· <tspan fill="#1C2E24" font-weight="bold">SQLite WAL 测试</tspan>：在多线程</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="85" y="400">  并发写入读数场景下，无一例</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="85" y="424">  死锁与阻塞错误发生。</text></g>

  
  <g id="kpi-card-2">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M362,125 H598 A12,12 0 0 1 610,137 V573 A12,12 0 0 1 598,585 H362 A12,12 0 0 1 350,573 V137 A12,12 0 0 1 362,125 Z" />
    <path d="M 350,137 A 12,12 0 0,1 362,125 L 598,125 A 12,12 0 0,1 610,137 L 610,140 L 350,140 Z" fill="#8E5B3C" />

    <text x="480" y="210" font-family="Quicksand, sans-serif" font-size="42" font-weight="bold" fill="#8E5B3C" text-anchor="middle">4 / 4</text>
    <text x="480" y="240" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#809085" text-anchor="middle">全链路 Smoke 压测</text>
    <line x1="380" y1="260" x2="580" y2="260" stroke="#D1DAD4" stroke-width="1" />

    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="300"><tspan>· <tspan fill="#1C2E24" font-weight="bold">四大链路压测全部通过</tspan>：</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="324">  1. 设备 claim 认领绑定闭环；</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="348">  2. memory-chat 长期记忆生成；</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="372">  3. memory-citation 引用回溯；</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="396">  4. Reranker 多候选召回排序。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="424"><tspan>· <tspan fill="#1C2E24" font-weight="bold">真实硬件现场模拟</tspan>：全天候</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="375" y="448">  长跑未见 MQTT 连接断连。</text></g>

  
  <g id="kpi-card-3">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M652,125 H888 A12,12 0 0 1 900,137 V573 A12,12 0 0 1 888,585 H652 A12,12 0 0 1 640,573 V137 A12,12 0 0 1 652,125 Z" />
    <path d="M 640,137 A 12,12 0 0,1 652,125 L 888,125 A 12,12 0 0,1 900,137 L 900,140 L 640,140 Z" fill="#DDA43B" />

    <text x="770" y="210" font-family="Quicksand, sans-serif" font-size="42" font-weight="bold" fill="#DDA43B" text-anchor="middle">100 %</text>
    <text x="770" y="240" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#809085" text-anchor="middle">Hybrid+Rerank 检索精度</text>
    <line x1="670" y1="260" x2="870" y2="260" stroke="#D1DAD4" stroke-width="1" />

    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="300"><tspan>· <tspan fill="#1C2E24" font-weight="bold">评估数据集表现优异</tspan>：</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="324">  在 120 条真实长期记忆与 48 </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="348">  个查询对的混淆召回评估中，</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="372">  Top-1、Top-3 及 MRR 指标</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="396">  均达成 100% 的准确率。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="424"><tspan>· <tspan fill="#1C2E24" font-weight="bold">杜绝大模型幻觉</tspan>：只说基于</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="665" y="448">  记忆的真话，不做编造感知。</text></g>

  
  <g id="kpi-card-4">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M942,125 H1178 A12,12 0 0 1 1190,137 V573 A12,12 0 0 1 1178,585 H942 A12,12 0 0 1 930,573 V137 A12,12 0 0 1 942,125 Z" />
    <path d="M 930,137 A 12,12 0 0,1 942,125 L 1178,125 A 12,12 0 0,1 1190,137 L 1190,140 L 930,140 Z" fill="#2B583E" />

    <text x="1060" y="210" font-family="Quicksand, sans-serif" font-size="42" font-weight="bold" fill="#2B583E" text-anchor="middle">&lt; 300</text>
    <text x="1060" y="240" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#809085" text-anchor="middle">文件行数控制规范</text>
    <line x1="960" y1="260" x2="1160" y2="260" stroke="#D1DAD4" stroke-width="1" />

    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="300"><tspan>· <tspan fill="#1C2E24" font-weight="bold">职责极其清晰分离</tspan>：</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="324">  遵循严苛开发自律规约，</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="348">  Server 模块的 API、业务与 DB </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="372">  均在独立文件维护，包内所有</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="396">  文件代码均严格在 300 行以内。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="424"><tspan>· <tspan fill="#1C2E24" font-weight="bold">桌面端完全重构</tspan>：拆分冗余</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="448">  Dashboard 与 Chat 的大型文件</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="955" y="472">  ，达成极致的 SoC 职责分离。</text></g>

  
  <g id="footer-group">
    <text x="60" y="685" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="10" fill="#809085" text-anchor="end">14</text>
  </g>
</svg>