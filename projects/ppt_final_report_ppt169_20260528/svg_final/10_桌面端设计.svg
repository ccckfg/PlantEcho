<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#F4F6F4" />

  
  <g id="header-group">
    <path fill="#2B583E" fill-opacity="0.08" d="M73,40 H167 A13,13 0 0 1 180,53 V53 A13,13 0 0 1 167,66 H73 A13,13 0 0 1 60,53 V53 A13,13 0 0 1 73,40 Z" />
    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">终端体验层</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">桌面客户端：轻量 Tauri v2 与 Dashboard 设计</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  <g id="left-card-tauri">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M72,120 H608 A12,12 0 0 1 620,132 V568 A12,12 0 0 1 608,580 H72 A12,12 0 0 1 60,568 V132 A12,12 0 0 1 72,120 Z" />
    <path d="M 60,132 A 12,12 0 0,1 72,120 L 608,120 A 12,12 0 0,1 620,132 L 620,135 L 60,135 Z" fill="#2B583E" />

    
    <path fill="#2B583E" fill-opacity="0.08" d="M110,155 H110 A20,20 0 0 1 130,175 V175 A20,20 0 0 1 110,195 H110 A20,20 0 0 1 90,175 V175 A20,20 0 0 1 110,155 Z" />
    <use data-icon="tabler-filled/device-cpu" x="98" y="163" width="24" height="24" fill="#2B583E" />
    <text x="145" y="181" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">Tauri v2 极致轻量桌面骨架</text>
    <text x="145" y="205" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#809085">深度融合 React 18 + Vite 5 + TS</text>

    
    <g id="tauri-feature-1">
      <circle cx="105" cy="260" r="15" fill="#2B583E" fill-opacity="0.1" />
      <text x="105" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#2B583E" text-anchor="middle">✔</text>
      <text x="135" y="255" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">极小安装包体积与冷启动开销</text>
      <text x="135" y="278" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">基于 Tauri v2 渲染引擎，冷启动冷启动内存低至数MB，包体积仅为 Electron 的 5%。</text>
    </g>

    <g id="tauri-feature-2">
      <circle cx="105" cy="350" r="15" fill="#2B583E" fill-opacity="0.1" />
      <text x="105" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#2B583E" text-anchor="middle">✔</text>
      <text x="135" y="345" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">多植物路由动态控制</text>
      <text x="135" y="368" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">客户端统筹编码 <tspan font-family="Consolas, monospace" fill="#8E5B3C">plantId</tspan>，支持在同一个主应用中动态加载并无感切换多盆植物档案。</text>
    </g>

    <g id="tauri-feature-3">
      <circle cx="105" cy="440" r="15" fill="#2B583E" fill-opacity="0.1" />
      <text x="105" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#2B583E" text-anchor="middle">✔</text>
      <text x="135" y="435" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">SSE 增量流式实时刷新</text>
      <text x="135" y="458" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">根部静默订阅 SSE 通道，任意设备上传读数都会动态同步至全部前端组件，无感刷新。</text>
    </g>
  </g>

  
  <g id="right-card-dashboard">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M672,120 H1208 A12,12 0 0 1 1220,132 V568 A12,12 0 0 1 1208,580 H672 A12,12 0 0 1 660,568 V132 A12,12 0 0 1 672,120 Z" />
    <path d="M 660,132 A 12,12 0 0,1 672,120 L 1208,120 A 12,12 0 0,1 1220,132 L 1220,135 L 660,135 Z" fill="#8E5B3C" />

    
    <path fill="#8E5B3C" fill-opacity="0.08" d="M710,155 H710 A20,20 0 0 1 730,175 V175 A20,20 0 0 1 710,195 H710 A20,20 0 0 1 690,175 V175 A20,20 0 0 1 710,155 Z" />
    
  <g transform="translate(698.0, 163.0)" fill="#8E5B3C">
    <path d="M12 19a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M18.313 16.91l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.218 -1.567l.102 .07z" />
    <path d="M7.007 16.993a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z" />
    <path d="M4 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M21 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M6.213 4.81l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.217 -1.567l.102 .07z" />
    <path d="M19.107 4.893a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z" />
    <path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M12 7a5 5 0 1 1 -4.995 5.217l-.005 -.217l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
  </g>
    <text x="745" y="181" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">温室主页 Dashboard 交互设计</text>
    <text x="745" y="205" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#809085"> Verdan Echo 森林与土壤自然配色体系落地</text>

    
    <g id="dashboard-feature-1">
      <circle cx="705" cy="260" r="15" fill="#8E5B3C" fill-opacity="0.1" />
      <text x="705" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C" text-anchor="middle">✔</text>
      <text x="735" y="255" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">时段问候语与动态天气组件</text>
      <text x="735" y="278" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">进入温室时根据时辰温馨显示“早安/午安/晚上好”，让用户每次登录都有“被植物注视”的陪伴感。</text>
    </g>

    <g id="dashboard-feature-2">
      <circle cx="705" cy="350" r="15" fill="#8E5B3C" fill-opacity="0.1" />
      <text x="705" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C" text-anchor="middle">✔</text>
      <text x="735" y="345" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">一键浇水功能与 5 秒撤销</text>
      <text x="735" y="368" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">执行浇水后，右下角触发精致 Toast，允许用户在 5 秒内“一键撤销”，彻底消除误操作造成的烦恼。</text>
    </g>

    <g id="dashboard-feature-3">
      <circle cx="705" cy="440" r="15" fill="#8E5B3C" fill-opacity="0.1" />
      <text x="705" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C" text-anchor="middle">✔</text>
      <text x="735" y="435" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">多植物卡片 Bento 栅格矩阵</text>
      <text x="735" y="458" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">每盆植物被独立置于一个精致卡片中，头像、状态 Chip 标签、当天一句话概括，主次分明。</text>
    </g>
  </g>

  
  <g id="footer-group">
    <text x="60" y="685" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="10" fill="#809085" text-anchor="end">10</text>
  </g>
</svg>