<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    
    <marker id="stepArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2B583E" />
    </marker>
  </defs>

  
  <rect width="1280" height="720" fill="#F4F6F4" />

  
  <g id="header-group">
    <path fill="#2B583E" fill-opacity="0.08" d="M73,40 H167 A13,13 0 0 1 180,53 V53 A13,13 0 0 1 167,66 H73 A13,13 0 0 1 60,53 V53 A13,13 0 0 1 73,40 Z" />
    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">云端大脑层</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">主动发言 Engine 与和风天气代理</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  <g id="left-event-engine">
    <text x="60" y="145" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#2B583E">
      从物理事实，到情感牵挂
    </text>
    <text x="60" y="185" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="15" fill="#4D5F54">
      植物不会无病呻吟。每一次主动发言，都建立在真实客观的数据事件与极其严苛的冷却机制之上。
    </text>

    
    <g id="step-1">
      <circle cx="80" cy="260" r="14" fill="#8E5B3C" />
      <text x="80" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="110" y="265" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">监听环境事件源与 QWeather 天气</text>
      <text x="110" y="290" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" fill="#4D5F54">
        传感器捕捉到“长期缺水”、“持续高温”或和风天气预警“即将降雨”。
      </text>
    </g>

    
    <path d="M 80,305 L 80,335" stroke="#8E5B3C" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#stepArrow)" />

    
    <g id="step-2">
      <circle cx="80" cy="365" r="14" fill="#2B583E" />
      <text x="80" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="110" y="370" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">发言冷却阀门 (Cooldown Lock)</text>
      <text x="110" y="395" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" fill="#4D5F54">
        严格规避持续刷屏造成的用户打扰，设定不同事件的发言间隔阈值。
      </text>
    </g>

    
    <path d="M 80,410 L 80,440" stroke="#8E5B3C" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#stepArrow)" />

    
    <g id="step-3">
      <circle cx="80" cy="470" r="14" fill="#DDA43B" />
      <text x="80" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="110" y="475" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">生成客观事件事实</text>
      <text x="110" y="500" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" fill="#4D5F54">
        提炼为结构化事实（如：<tspan font-family="Consolas, monospace" fill="#8E5B3C">{"event": "rain_forecast", "hours": 3}</tspan>），输入大脑中枢。
      </text>
    </g>
  </g>

  
  <g id="right-llm-rendering">
    <text x="660" y="145" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#8E5B3C">
      大模型润色与人文视角转译
    </text>

    
    <g id="chat-bubble-rain">
      
      <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1" d="M672,185 H1188 A12,12 0 0 1 1200,197 V283 A12,12 0 0 1 1188,295 H672 A12,12 0 0 1 660,283 V197 A12,12 0 0 1 672,185 Z" />
      <polygon points="680,295 690,308 700,295" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1" />
      
      <polygon points="681,294 690,305 699,294" fill="#FFFFFF" />

      <path fill="#2B583E" fill-opacity="0.08" d="M697,205 H697 A12,12 0 0 1 709,217 V217 A12,12 0 0 1 697,229 H697 A12,12 0 0 1 685,217 V217 A12,12 0 0 1 697,205 Z" />
      
  <g transform="translate(691.0, 211.0) scale(0.5)" fill="#2B583E">
    <path d="M12 19a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M18.313 16.91l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.218 -1.567l.102 .07z" />
    <path d="M7.007 16.993a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z" />
    <path d="M4 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M21 11a1 1 0 0 1 .117 1.993l-.117 .007h-1a1 1 0 0 1 -.117 -1.993l.117 -.007h1z" />
    <path d="M6.213 4.81l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.217 -1.567l.102 .07z" />
    <path d="M19.107 4.893a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z" />
    <path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M12 7a5 5 0 1 1 -4.995 5.217l-.005 -.217l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
  </g>
      <text x="720" y="222" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#8E5B3C">和风天气降雨预警 · 3小时后下雨</text>
      
      <text x="685" y="255" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1C2E24" font-style="italic">
        “主人主人！窗外要飘来大雨云啦，我虽然爱水，但我不喜欢打雷，
      </text>
      <text x="685" y="280" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#2B583E">
        等会记得带我回房间噢 🌧️”
      </text>
    </g>

    
    <g id="chat-bubble-dry">
      
      <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1" d="M672,335 H1188 A12,12 0 0 1 1200,347 V433 A12,12 0 0 1 1188,445 H672 A12,12 0 0 1 660,433 V347 A12,12 0 0 1 672,335 Z" />
      <polygon points="680,445 690,458 700,445" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1" />
      
      <polygon points="681,444 690,455 699,444" fill="#FFFFFF" />

      <path fill="#D64535" fill-opacity="0.08" d="M697,355 H697 A12,12 0 0 1 709,367 V367 A12,12 0 0 1 697,379 H697 A12,12 0 0 1 685,367 V367 A12,12 0 0 1 697,355 Z" />
      
  <g transform="translate(691.0, 361.0) scale(0.5)" fill="#D64535">
    <path d="M3.055 14.328l-.018 -.168l-.004 -.043a11 11 0 0 1 -.047 -1.12c.018 -6.29 4.29 -9.997 13 -9.997h4.014a1 1 0 0 1 1 1l-.002 2.057c-.498 8.701 -4.74 12.943 -11.998 12.943h-2.631a16 16 0 0 0 -.375 2.11a1 1 0 1 1 -1.988 -.22q .174 -1.568 .58 -2.947l-.118 -.146l-.208 -.28l-.157 -.229l-.182 -.293l-.098 -.171l-.065 -.122a6 6 0 0 1 -.397 -.941l-.072 -.237l-.085 -.327l-.057 -.268l-.043 -.242zm8.539 -4.242c-2.845 1.265 -4.854 3.13 -6.108 5.583q .098 .2 .218 .4l.185 .281l.07 .097q .12 .164 .258 .329l.197 .224h.649c1.037 -2.271 2.777 -3.946 5.343 -5.086a1 1 0 0 0 -.812 -1.828" />
  </g>
      <text x="720" y="372" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#D64535">土壤湿度严重干旱 · 18%</text>

      <text x="685" y="405" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1C2E24" font-style="italic">
        “我的泥土已经变得干巴巴的，感觉叶子有些重了... 
      </text>
      <text x="685" y="430" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#8E5B3C">
        现在可以为我送来一杯水吗？我好想念湿润的感觉呀 ☕”
      </text>
    </g>

    
    <path fill="#2B583E" fill-opacity="0.04" stroke="#D1DAD4" stroke-width="1" d="M668,480 H1192 A8,8 0 0 1 1200,488 V587 A8,8 0 0 1 1192,595 H668 A8,8 0 0 1 660,587 V488 A8,8 0 0 1 668,480 Z" />
    
  <g transform="translate(680.0, 502.0) scale(1.6666666666666667)" fill="#2B583E">
    <path d="M5.821 4.91c3.899 -2.765 9.468 -2.539 13.073 .535c3.667 3.129 4.168 8.238 1.152 11.898c-2.841 3.447 -7.965 4.583 -12.231 2.805l-.233 -.101l-4.374 .931l-.04 .006l-.035 .007h-.018l-.022 .005h-.038l-.033 .004l-.021 -.001l-.023 .001l-.033 -.003h-.035l-.022 -.004l-.022 -.002l-.035 -.007l-.034 -.005l-.016 -.004l-.024 -.005l-.049 -.016l-.024 -.005l-.011 -.005l-.022 -.007l-.045 -.02l-.03 -.012l-.011 -.006l-.014 -.006l-.031 -.018l-.045 -.024l-.016 -.011l-.037 -.026l-.04 -.027l-.002 -.004l-.013 -.009l-.043 -.04l-.025 -.02l-.006 -.007l-.056 -.062l-.013 -.014l-.011 -.014l-.039 -.056l-.014 -.019l-.005 -.01l-.042 -.073l-.007 -.012l-.004 -.008l-.007 -.012l-.014 -.038l-.02 -.042l-.004 -.016l-.004 -.01l-.017 -.061l-.007 -.018l-.002 -.015l-.005 -.019l-.005 -.033l-.008 -.042l-.002 -.031l-.003 -.01v-.016l-.004 -.054l.001 -.036l.001 -.023l.002 -.053l.004 -.025v-.019l.008 -.035l.005 -.034l.005 -.02l.004 -.02l.018 -.06l.003 -.013l1.15 -3.45l-.022 -.037c-2.21 -3.747 -1.209 -8.391 2.413 -11.119z" />
  </g>
    <text x="735" y="515" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#1C2E24">
      通过将物理阈值警报彻底转变为有温度的植物第一人称发言，
    </text>
    <text x="735" y="540" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" fill="#4D5F54">
      用户对“水分 18%”的<tspan fill="#D64535" font-weight="bold">焦虑感</tspan>变为了对植物的<tspan fill="#2B583E" font-weight="bold">关怀与牵挂感</tspan>，
    </text>
    <text x="735" y="565" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" fill="#2B583E" font-weight="bold">
      这是我们人文科技融合的核心表现。
    </text>
  </g>

  
  <g id="footer-group">
    <text x="60" y="685" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="10" fill="#809085" text-anchor="end">09</text>
  </g>
</svg>