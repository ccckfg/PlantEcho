      <rect x="60" y="390" width="460" height="15" fill="#2B583E" />
      
      
  <g transform="translate(75.0, 378.0) scale(0.75)" fill="#FFFFFF">
    <path d="M3.055 14.328l-.018 -.168l-.004 -.043a11 11 0 0 1 -.047 -1.12c.018 -6.29 4.29 -9.997 13 -9.997h4.014a1 1 0 0 1 1 1l-.002 2.057c-.498 8.701 -4.74 12.943 -11.998 12.943h-2.631a16 16 0 0 0 -.375 2.11a1 1 0 1 1 -1.988 -.22q .174 -1.568 .58 -2.947l-.118 -.146l-.208 -.28l-.157 -.229l-.182 -.293l-.098 -.171l-.065 -.122a6 6 0 0 1 -.397 -.941l-.072 -.237l-.085 -.327l-.057 -.268l-.043 -.242zm8.539 -4.242c-2.845 1.265 -4.854 3.13 -6.108 5.583q .098 .2 .218 .4l.185 .281l.07 .097q .12 .164 .258 .329l.197 .224h.649c1.037 -2.271 2.777 -3.946 5.343 -5.086a1 1 0 0 0 -.812 -1.828" />
  </g>
      <text x="105" y="393" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#FFFFFF">ota_manifest.json</text>
      
      
      <text fill="#809085" font-size="14" font-family="Consolas, 'Courier New', monospace" x="90" y="440">{</text><text fill="#1C2E24" font-size="14" font-family="Consolas, 'Courier New', monospace" x="110" y="465"><tspan><tspan fill="#8E5B3C">"version"</tspan>: <tspan fill="#3B8756">"0.2.1"</tspan>,</tspan>
        </text><text fill="#1C2E24" font-size="14" font-family="Consolas, 'Courier New', monospace" x="110" y="490"><tspan><tspan fill="#8E5B3C">"url"</tspan>: <tspan fill="#3B8756">"http://.../firmware.bin"</tspan>,</tspan>
        </text><text fill="#1C2E24" font-size="14" font-family="Consolas, 'Courier New', monospace" x="110" y="515"><tspan><tspan fill="#8E5B3C">"md5"</tspan>: <tspan fill="#3B8756">"9a8e2b83c...fc82"</tspan>,</tspan>
        </text><text fill="#1C2E24" font-size="14" font-family="Consolas, 'Courier New', monospace" x="110" y="540"><tspan><tspan fill="#8E5B3C">"size_bytes"</tspan>: <tspan fill="#DDA43B">2049555</tspan></tspan>
        </text><text fill="#809085" font-size="14" font-family="Consolas, 'Courier New', monospace" x="90" y="565">}</text></g>

    
    <g id="ota-desc-group">
      <path fill="#2B583E" fill-opacity="0.08" d="M570,370 H570 A20,20 0 0 1 590,390 V390 A20,20 0 0 1 570,410 H570 A20,20 0 0 1 550,390 V390 A20,20 0 0 1 570,370 Z" />
      <use data-icon="tabler-filled/rocket" x="558" y="378" width="24" height="24" fill="#2B583E" />
      <text x="605" y="396" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">OTA 在线无缝热更新</text>
      
      <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="550" y="445"><tspan>· <tspan fill="#1C2E24" font-weight="bold">Manifest 轻量宣告</tspan>：ESP32 定时轮询后端 HTTP/MQTT 宣告接口，</tspan>
        </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="550" y="471">  比对本地版本。一旦版本匹配升级宣告，启动静默更新。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="550" y="503"><tspan>· <tspan fill="#1C2E24" font-weight="bold">MD5 数据完整性校验</tspan>：在空中下载 firmware.bin 后，固件会</tspan>
        </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="550" y="529">  在硬件端自动进行 MD5 校验，防止数据受损导致系统崩塌（Brick）。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="550" y="561"><tspan>· <tspan fill="#1C2E24" font-weight="bold">热分区双备份 (Partition Rollback)</tspan>：利用 ESP32 双 OTA 分区，</tspan>
        </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="550" y="587">  新固件先写入备用区。若运行失败自动回滚，确保设备 100% 不变砖。</text></g>
  </g>

  
  <g id="footer-group">
