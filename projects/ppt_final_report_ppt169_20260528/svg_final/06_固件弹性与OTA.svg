<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    
    <marker id="flowArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2B583E" />
    </marker>
  </defs>

  
  <rect width="1280" height="720" fill="#F4F6F4" />

  
  <g id="header-group">
    <path fill="#2B583E" fill-opacity="0.08" d="M73,40 H167 A13,13 0 0 1 180,53 V53 A13,13 0 0 1 167,66 H73 A13,13 0 0 1 60,53 V53 A13,13 0 0 1 73,40 Z" />
    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">硬件与物联层</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">固件弹性：数据持久化与 OTA 在线更新</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  <g id="top-interactive-flow">
    
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" stroke-dasharray="4,4" d="M70,115 H1210 A10,10 0 0 1 1220,125 V330 A10,10 0 0 1 1210,340 H70 A10,10 0 0 1 60,330 V125 A10,10 0 0 1 70,115 Z" />
    
    
    <g id="flow-node-1">
      <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M108,150 H312 A8,8 0 0 1 320,158 V292 A8,8 0 0 1 312,300 H108 A8,8 0 0 1 100,292 V158 A8,8 0 0 1 108,150 Z" />
