  <g transform="translate(125.0, 175.0) scale(0.8333333333333334)" fill="#2B583E">
    <path d="M8.813 11.612c.457 -.38 .918 -.38 1.386 .011l.108 .098l4.986 4.986l.094 .083a1 1 0 0 0 1.403 -1.403l-.083 -.094l-1.292 -1.293l.292 -.293l.106 -.095c.457 -.38 .918 -.38 1.386 .011l.108 .098l4.674 4.675a4 4 0 0 1 -3.775 3.599l-.206 .005h-12a4 4 0 0 1 -3.98 -3.603l6.687 -6.69l.106 -.095zm9.187 -9.612a4 4 0 0 1 3.995 3.8l.005 .2v9.585l-3.293 -3.292l-.15 -.137c-1.256 -1.095 -2.85 -1.097 -4.096 -.017l-.154 .14l-.307 .306l-2.293 -2.292l-.15 -.137c-1.256 -1.095 -2.85 -1.097 -4.096 -.017l-.154 .14l-5.307 5.306v-9.585a4 4 0 0 1 3.8 -3.995l.2 -.005h12zm-2.99 5l-.127 .007a1 1 0 0 0 0 1.986l.117 .007l.127 -.007a1 1 0 0 0 0 -1.986l-.117 -.007z" />
  </g>
      <text x="165" y="190" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">1. Tauri 客户端认领</text>
      <text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="120" y="230">用户在 App 发现待认</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="120" y="250">领设备，输入植物名称</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="120" y="270">并发起 claim 认领绑定。</text></g>

    
    <path d="M 335,225 L 495,225" stroke="#2B583E" stroke-width="2" marker-end="url(#flowArrow)" />
    <text x="415" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#2B583E" text-anchor="middle">HTTP Claim</text>

    
    <g id="flow-node-2">
      <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M518,150 H762 A8,8 0 0 1 770,158 V292 A8,8 0 0 1 762,300 H518 A8,8 0 0 1 510,292 V158 A8,8 0 0 1 518,150 Z" />
      <path fill="#8E5B3C" fill-opacity="0.08" d="M545,170 H545 A15,15 0 0 1 560,185 V185 A15,15 0 0 1 545,200 H545 A15,15 0 0 1 530,185 V185 A15,15 0 0 1 545,170 Z" />
      
  <g transform="translate(535.0, 175.0) scale(0.8333333333333334)" fill="#8E5B3C">
