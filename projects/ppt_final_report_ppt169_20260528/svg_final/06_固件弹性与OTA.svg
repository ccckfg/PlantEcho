    <path d="M3 9.731c1.968 1.507 5.234 2.269 9 2.269c3.76 0 7.025 -.76 9 -2.252v2.252c0 2.477 -4.062 4 -9 4c-4.798 0 -8.77 -1.438 -8.979 -3.795l-.016 -.101l-.005 -.104z" />
    <path d="M12 2c1.041 0 2.044 .068 2.977 .198l.469 .071q .84 .14 1.586 .348l.44 .131l.075 .024a11 11 0 0 1 .805 .3l.199 .086q .535 .242 .967 .53q .165 .11 .313 .225a3.8 3.8 0 0 1 .669 .668l.091 .128q .07 .105 .129 .211l.07 .139q .163 .35 .2 .73l.01 .211c0 2.477 -4.062 4 -9 4c-4.798 0 -8.77 -1.438 -8.979 -3.795a1 1 0 0 1 -.021 -.205l.005 -.104l.016 -.1c.205 -2.306 4.01 -3.733 8.667 -3.794z" />
  </g>
      <text x="575" y="190" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">2. 后端生成加密密钥</text>
      <text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="530" y="230">服务端为设备生成唯一的 API Key，</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="530" y="250">将其 Hash 校验值持久化，并通过</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="530" y="270">MQTT config 主题回传下发。</text></g>

    
    <path d="M 785,225 L 915,225" stroke="#2B583E" stroke-width="2" marker-end="url(#flowArrow)" />
    <text x="850" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#2B583E" text-anchor="middle">MQTT Config</text>

    
    <g id="flow-node-3">
      <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M938,150 H1182 A8,8 0 0 1 1190,158 V292 A8,8 0 0 1 1182,300 H938 A8,8 0 0 1 930,292 V158 A8,8 0 0 1 938,150 Z" />
      <path fill="#2B583E" fill-opacity="0.08" d="M965,170 H965 A15,15 0 0 1 980,185 V185 A15,15 0 0 1 965,200 H965 A15,15 0 0 1 950,185 V185 A15,15 0 0 1 965,170 Z" />
      <use data-icon="tabler-filled/device-cpu" x="955" y="175" width="20" height="20" fill="#2B583E" />
      <text x="995" y="190" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">3. ESP32 自动保存 NVS</text>
      <text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="950" y="230">ESP32 接收密钥后，调用底层</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="950" y="250">NVS (Non-volatile Storage) API</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="950" y="270">持久化保存，断电仍可安全重连。</text></g>
  </g>

  
  <g id="bottom-ota-mechanism">
    
    <g id="ota-code-card">
      <path fill="#1A3E2A" fill-opacity="0.04" stroke="#D1DAD4" stroke-width="1" d="M68,370 H512 A8,8 0 0 1 520,378 V597 A8,8 0 0 1 512,605 H68 A8,8 0 0 1 60,597 V378 A8,8 0 0 1 68,370 Z" />
