      <text x="160" y="282" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">读取 soilRaw，在固件中转化为 soilPercent (0%-100%)。</text>
    </g>

    
