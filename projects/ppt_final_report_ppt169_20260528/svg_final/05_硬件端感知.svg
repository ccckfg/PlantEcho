    <text x="745" y="181" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">毫秒级 MQTT 协议与 SoftAP 配网</text>
    <text x="745" y="205" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#809085">实现底端设备与云端高速闭环</text>

    
    
    <g id="iot-detail-1">
      <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M696,240 H734 A6,6 0 0 1 740,246 V284 A6,6 0 0 1 734,290 H696 A6,6 0 0 1 690,284 V246 A6,6 0 0 1 696,240 Z" />
      
