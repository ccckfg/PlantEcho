      <text x="160" y="360" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">SHT40 瑞士高精度空气温湿度芯片</text>
      <text x="160" y="382" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">I2C (0x44) 读取 airTempC &amp; airHumidityPercent，误差低至 ±1.5%。</text>
    </g>

    
    <g id="sensor-detail-3">
      <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M96,440 H134 A6,6 0 0 1 140,446 V484 A6,6 0 0 1 134,490 H96 A6,6 0 0 1 90,484 V446 A6,6 0 0 1 96,440 Z" />
      
