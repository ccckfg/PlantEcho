      <text x="160" y="460" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">GY-302 / BH1750 环境光照强传感器</text>
      <text x="160" y="482" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">I2C (0x23) 采集环境光照 lux 值，作为植物日光浴与避光的计算基础。</text>
    </g>
  </g>

  
  <g id="right-card-iot">
    
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M672,120 H1208 A12,12 0 0 1 1220,132 V568 A12,12 0 0 1 1208,580 H672 A12,12 0 0 1 660,568 V132 A12,12 0 0 1 672,120 Z" />
