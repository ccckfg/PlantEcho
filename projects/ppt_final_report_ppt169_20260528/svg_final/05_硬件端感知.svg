  </g>
      <text x="760" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">秒级 MQTT 上报机制</text>
      <text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="760" y="285"><tspan>固件向主题 <tspan fill="#8E5B3C" font-family="Consolas, monospace">dyn/devices/:deviceId/readings</tspan> 发送 JSON 载</tspan>
        </text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="760" y="305">荷，服务器高并发 MQTT broker 实时捕获并秒级入库。</text></g>

    
    <g id="iot-detail-2">
      <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M696,355 H734 A6,6 0 0 1 740,361 V399 A6,6 0 0 1 734,405 H696 A6,6 0 0 1 690,399 V361 A6,6 0 0 1 696,355 Z" />
      <use data-icon="tabler-filled/rocket" x="700" y="365" width="30" height="30" fill="#2B583E" />
      <text x="760" y="375" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">长按 3 秒 SoftAP 极简配网</text>
      <text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="760" y="400">用户只需长按 BOOT 键约 3 秒，ESP32 自动开启 SoftAP 热点，</text><text fill="#4D5F54" font-size="13" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="760" y="420">允许手机/电脑通过网页零门槛配网，Wi-Fi 配置安全写入 NVS。</text></g>

    
    <path fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1" d="M698,475 H1182 A8,8 0 0 1 1190,483 V532 A8,8 0 0 1 1182,540 H698 A8,8 0 0 1 690,532 V483 A8,8 0 0 1 698,475 Z" />
    <text x="710" y="500" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">
      <tspan fill="#2B583E" font-weight="bold">技术保障</tspan>：网络连接失败时，设备将启动<tspan fill="#8E5B3C" font-weight="bold">离线重连指数退避算法</tspan>，
    </text>
    <text x="710" y="522" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4D5F54">
      避免无线信道拥堵；认领成功的密钥会自动自动回传硬件以提供底层鉴权。
    </text>
  </g>

  
