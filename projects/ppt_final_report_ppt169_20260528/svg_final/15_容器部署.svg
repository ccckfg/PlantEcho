      <text x="840" y="173" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">生产发布环境严密验证</text>

      
      <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="215"><tspan>· <tspan fill="#1C2E24" font-weight="bold">本地临时容器完美验证</tspan>：</tspan>
        </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="239">  在正式推送前，于本地拉起临时容器，</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="263">  进行严格的 /health 存活检测和 API 键</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="287">  校验；验证无误后彻底删除清理，符合</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="311">  高自律工程规范，杜绝环境残留污染。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="347"><tspan>· <tspan fill="#1C2E24" font-weight="bold">一键极简拉起服务</tspan>：</tspan>
        </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="371">  封装单机灰度 compose 配置，服务器只需</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="395"><tspan>  运行 <tspan font-family="Consolas, monospace" fill="#8E5B3C">docker compose up -d</tspan>，即可一键</tspan>
        </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="419">  拉取镜像并安全后台运行，开箱即用。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="455"><tspan>· <tspan fill="#1C2E24" font-weight="bold">安全鉴权机制收口</tspan>：</tspan>
        </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="479">  外部注入访问密钥强制拦截非授权，仅</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="815" y="503">  保留设备 MQTT readings 接收鉴权口。</text></g>
  </g>

  
