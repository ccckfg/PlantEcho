  <g id="left-docker-intro">
    <text x="60" y="145" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#2B583E">
      一键上云，极简交付
    </text>
    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="185">项目不仅在本地开发跑</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="211">通，更是面向生产环境</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="237">交付，通过严苛容器化</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="263">构建打包并推送发布，</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="289">提供完整单机灰度能力。</text><path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1" d="M68,360 H362 A8,8 0 0 1 370,368 V577 A8,8 0 0 1 362,585 H68 A8,8 0 0 1 60,577 V368 A8,8 0 0 1 68,360 Z" />
    
