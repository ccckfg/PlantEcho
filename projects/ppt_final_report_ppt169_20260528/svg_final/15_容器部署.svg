    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">工程与部署层</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">云端发布：Docker Hub 官方镜像与单键部署</text>
