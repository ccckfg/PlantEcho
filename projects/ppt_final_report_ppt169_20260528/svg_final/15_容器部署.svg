    <text x="128" y="408" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">Docker Hub 官方镜像</text>
    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="80" y="445">镜像已成功发布至公开库：</text><text fill="#8E5B3C" font-size="14" font-family="Consolas, monospace" x="80" y="467" font-weight="bold">ccckfg/dyn:latest</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="80" y="489">本地多阶段多机构建，移除冗</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="80" y="511">余垃圾，极致压缩层级包开销。</text></g>

  
