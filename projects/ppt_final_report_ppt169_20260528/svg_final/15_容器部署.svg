      <text x="480" y="173" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">docker-compose.yml 部署配置</text>

      
      <text fill="#809085" font-size="13" font-family="Consolas, 'Courier New', monospace" x="460" y="215">version: '3.8'</text><text fill="#2B583E" font-size="13" font-family="Consolas, 'Courier New', monospace" x="460" y="237">services:</text><text fill="#2B583E" font-size="13" font-family="Consolas, 'Courier New', monospace" x="480" y="259">  server:</text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="500" y="281"><tspan><tspan fill="#8E5B3C">    image:</tspan> ccckfg/dyn:latest</tspan>
        </text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="500" y="303"><tspan><tspan fill="#8E5B3C">    container_name:</tspan> dyn-server</tspan>
        </text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="500" y="325"><tspan><tspan fill="#8E5B3C">    ports:</tspan></tspan>
        </text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="520" y="347">      - "8787:8787"</text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="500" y="369"><tspan><tspan fill="#8E5B3C">    environment:</tspan></tspan>
        </text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="520" y="391">      - PORT=8787</text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="520" y="413">      - APP_ACCESS_KEY=******</text><text fill="#1C2E24" font-size="13" font-family="Consolas, 'Courier New', monospace" x="500" y="435"><tspan><tspan fill="#8E5B3C">    restart:</tspan> always</tspan>
      </text></g>

    
