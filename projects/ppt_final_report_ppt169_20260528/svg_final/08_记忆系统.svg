      <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="905" y="495">事实被加工为一段带有时空印记</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="905" y="517">的植物主观叙事（如：“星期四下午</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="905" y="539">，我的泥土非常干燥，雅宁为我浇了水”）。</text></g>

    
