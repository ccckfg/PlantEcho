    <text x="128" y="368" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">BM25 + 向量双路检索</text>
    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="80" y="405">融合 FTS5 (BM25) 与 sqlite-vec </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="80" y="427">向量进行 Hybrid 双路召回，兼顾</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="80" y="449">关键词硬匹配与高层语义联想。</text><path fill="#2B583E" fill-opacity="0.08" d="M98,475 H98 A18,18 0 0 1 116,493 V493 A18,18 0 0 1 98,511 H98 A18,18 0 0 1 80,493 V493 A18,18 0 0 1 98,475 Z" />
