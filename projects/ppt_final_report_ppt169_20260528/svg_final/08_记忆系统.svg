  <g id="left-memory-theory">
    <text x="60" y="145" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#2B583E">
      让植物真正认识你
    </text>
    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="185">项目颠覆了传统的无状态</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="211">大模型对话，通过将读数与</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="237">交互转化为植物“脑海”中的</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="263">长期记忆，实现拟人共鸣。</text><path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1" d="M68,325 H362 A8,8 0 0 1 370,333 V577 A8,8 0 0 1 362,585 H68 A8,8 0 0 1 60,577 V333 A8,8 0 0 1 68,325 Z" />
    
