      <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="460" y="495">高重要度 Episode 被转化为向量写入</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="460" y="517">长期记忆，永久融入植物的认知世界，</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="460" y="539">对后续的所有对话提供稳定的人设基础。</text></g>

    
