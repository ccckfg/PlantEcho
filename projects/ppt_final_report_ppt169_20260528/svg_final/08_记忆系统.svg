      <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="460" y="230">高频环境传感器读数（土壤/温度/光照</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="460" y="252">）与用户零散聊天流，实时被静默写入</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="460" y="274">临时草稿流水区，保持底层高性能吞吐。</text></g>

    
