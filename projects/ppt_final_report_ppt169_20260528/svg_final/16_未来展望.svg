    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">未来规划篇</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">下一步：向更深处扎根，向更广处伸展</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  <g id="top-vision-text">
    <text x="60" y="155" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#2B583E">
      植物不会停下呼吸，我们的探索亦然
    </text>
    
    <text fill="#4D5F54" font-size="16" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="195">DYN Plant Pal (PlantEcho) 的 MVP 版本已经彻底证明了「人文理念 ＋ 智能物联」的巨大生命力。</text><text fill="#4D5F54" font-size="16" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="60" y="221">接下来，我们将从物理标定、用户终端功能外展以及大模型长跑压测三个方面深入演进，实现更完整的生态：</text></g>

  
  
  
  <g id="bento-future-1">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M72,300 H418 A12,12 0 0 1 430,312 V588 A12,12 0 0 1 418,600 H72 A12,12 0 0 1 60,588 V312 A12,12 0 0 1 72,300 Z" />
