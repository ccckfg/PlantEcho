    <text x="930" y="363" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">3. 记忆系统与语料压测</text>
    <text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="410"><tspan>· <tspan fill="#1C2E24" font-weight="bold">端侧本地大模型降维</tspan>：积极尝试</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="434">  在树莓派/边缘计算端部署轻量 LLM</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="458">  ，提供本地无网高共情响应兜底。</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="486"><tspan>· <tspan fill="#1C2E24" font-weight="bold">长尾真实养护压测</tspan>：使用极其</tspan>
      </text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="510">  丰富的长尾植物真实习性资料语料</text><text fill="#4D5F54" font-size="14" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="534">  压测主动发言 Prompt，确发言的合理性。</text></g>

  
