    <path d="M6.213 4.81l.094 .083l.7 .7a1 1 0 0 1 -1.32 1.497l-.094 -.083l-.7 -.7a1 1 0 0 1 1.217 -1.567l.102 .07z" />
    <path d="M19.107 4.893a1 1 0 0 1 .083 1.32l-.083 .094l-.7 .7a1 1 0 0 1 -1.497 -1.32l.083 -.094l.7 -.7a1 1 0 0 1 1.414 0z" />
    <path d="M12 2a1 1 0 0 1 .993 .883l.007 .117v1a1 1 0 0 1 -1.993 .117l-.007 -.117v-1a1 1 0 0 1 1 -1z" />
    <path d="M12 7a5 5 0 1 1 -4.995 5.217l-.005 -.217l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
  </g>

    <text x="880" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#1C2E24">SSE 实时同步通道</text>
    <text x="880" y="295" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C">sync_events 变更事件订阅</text>

    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="340"><tspan>· <tspan fill="#1C2E24" font-weight="bold">sync_events 审计表</tspan>：任何模块发生变</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="368">  更，自动写入事件流水，提供强一致性</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="396">  的增量更新证明。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="428"><tspan>· <tspan fill="#1C2E24" font-weight="bold">SSE 实时长连接</tspan>：Server-Sent Events</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="456">  推流通道，避免传统轮询（Polling）</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="484">  带来的网络抖动与多余开销。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="516"><tspan>· <tspan fill="#1C2E24" font-weight="bold">断线自动补收</tspan>：基于 <tspan font-family="Consolas, monospace">since</tspan> 参数，客</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="544">  户端重连自动拉取缺失增量，无缝拼接。</text></g>

  
