<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#F4F6F4" />

  
  <g id="header-group">
    <path fill="#2B583E" fill-opacity="0.08" d="M73,40 H167 A13,13 0 0 1 180,53 V53 A13,13 0 0 1 167,66 H73 A13,13 0 0 1 60,53 V53 A13,13 0 0 1 73,40 Z" />
    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">云端大脑层</text>
    <text x="196" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">服务端中枢：基于 Fastify 的模块化设计</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  
  
  <g id="card-server-1">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M72,125 H418 A12,12 0 0 1 430,137 V573 A12,12 0 0 1 418,585 H72 A12,12 0 0 1 60,573 V137 A12,12 0 0 1 72,125 Z" />
    <path d="M 60,137 A 12,12 0 0,1 72,125 L 418,125 A 12,12 0 0,1 430,137 L 430,140 L 60,140 Z" fill="#2B583E" />
    
    <path fill="#2B583E" fill-opacity="0.08" d="M114,170 H114 A24,24 0 0 1 138,194 V194 A24,24 0 0 1 114,218 H114 A24,24 0 0 1 90,194 V194 A24,24 0 0 1 114,170 Z" />
    <use data-icon="tabler-filled/device-cpu" x="100" y="180" width="28" height="28" fill="#2B583E" />

    <text x="90" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#1C2E24">Fastify 极速架构</text>
    <text x="90" y="295" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C">Node.js + TS 模块化后端</text>
    
    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="340"><tspan>· <tspan fill="#1C2E24" font-weight="bold">严格的类型与校验</tspan>：全栈 TypeScript</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="368">  配合 Zod 进行极其严苛的输入模式校验</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="396">  ，确保设备密钥轮换接口的安全。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="428"><tspan>· <tspan fill="#1C2E24" font-weight="bold">低损耗高并发</tspan>：Fastify 相比 Express</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="456">  拥有几乎翻倍的吞吐率，有效减少底端</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="484">  多传感器高频推流的系统瓶颈。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="516"><tspan>· <tspan fill="#1C2E24" font-weight="bold">OpenAI 兼容规范</tspan>：完全实现 V1 标准</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="544">  对话接口，无缝兼容各种第三方应用。</text></g>

  
  <g id="card-server-2">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M467,125 H813 A12,12 0 0 1 825,137 V573 A12,12 0 0 1 813,585 H467 A12,12 0 0 1 455,573 V137 A12,12 0 0 1 467,125 Z" />
    <path d="M 455,137 A 12,12 0 0,1 467,125 L 813,125 A 12,12 0 0,1 825,137 L 825,140 L 455,140 Z" fill="#8E5B3C" />

    <path fill="#8E5B3C" fill-opacity="0.08" d="M509,170 H509 A24,24 0 0 1 533,194 V194 A24,24 0 0 1 509,218 H509 A24,24 0 0 1 485,194 V194 A24,24 0 0 1 509,170 Z" />
    
  <g transform="translate(495.0, 180.0) scale(1.1666666666666667)" fill="#8E5B3C">
    <path d="M3 15.731c1.968 1.507 5.234 2.269 9 2.269c3.76 0 7.025 -.76 9 -2.252v2.252c0 2.425 -3.895 3.936 -8.693 3.998l-.307 .002c-4.938 0 -9 -1.523 -9 -4z" />
    <path d="M3 9.731c1.968 1.507 5.234 2.269 9 2.269c3.76 0 7.025 -.76 9 -2.252v2.252c0 2.477 -4.062 4 -9 4c-4.798 0 -8.77 -1.438 -8.979 -3.795l-.016 -.101l-.005 -.104z" />
    <path d="M12 2c1.041 0 2.044 .068 2.977 .198l.469 .071q .84 .14 1.586 .348l.44 .131l.075 .024a11 11 0 0 1 .805 .3l.199 .086q .535 .242 .967 .53q .165 .11 .313 .225a3.8 3.8 0 0 1 .669 .668l.091 .128q .07 .105 .129 .211l.07 .139q .163 .35 .2 .73l.01 .211c0 2.477 -4.062 4 -9 4c-4.798 0 -8.77 -1.438 -8.979 -3.795a1 1 0 0 1 -.021 -.205l.005 -.104l.016 -.1c.205 -2.306 4.01 -3.733 8.667 -3.794z" />
  </g>

    <text x="485" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#1C2E24">SQLite + WAL 引擎</text>
    <text x="485" y="295" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C">轻量高效的单文件数据库</text>

    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="340"><tspan>· <tspan fill="#1C2E24" font-weight="bold">SQLite 本地化底座</tspan>：极简嵌入式架构</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="368">  ，在单机受限场景下兼顾多表级联查询</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="396">  ，零外部服务网络开销。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="428"><tspan>· <tspan fill="#1C2E24" font-weight="bold">WAL 模式开启</tspan>：启用 Write-Ahead Log</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="456">  （预写日志），实现读写并行不阻塞，</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="484">  优雅应对硬件高频多路读数写入。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="516"><tspan>· <tspan fill="#1C2E24" font-weight="bold">sqlite-vec 向量底座</tspan>：直接以原生库</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="544">  方式加载，在本地实现极速向量检索。</text></g>

  
  <g id="card-server-3">
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M862,125 H1208 A12,12 0 0 1 1220,137 V573 A12,12 0 0 1 1208,585 H862 A12,12 0 0 1 850,573 V137 A12,12 0 0 1 862,125 Z" />
