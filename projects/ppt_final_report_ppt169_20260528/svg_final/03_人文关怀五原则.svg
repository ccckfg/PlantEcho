  <g transform="translate(890.0, 180.0) scale(1.1666666666666667)" fill="#DDA43B">
    <path d="M6.979 3.074a6 6 0 0 1 4.988 1.425l.037 .033l.034 -.03a6 6 0 0 1 4.733 -1.44l.246 .036a6 6 0 0 1 3.364 10.008l-.18 .185l-.048 .041l-7.45 7.379a1 1 0 0 1 -1.313 .082l-.094 -.082l-7.493 -7.422a6 6 0 0 1 3.176 -10.215z" />
  </g>

    <text x="880" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#1C2E24">原则三：控制权归用户</text>
    <text x="880" y="295" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C">极致的诚实与人机信任建立</text>

    
    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="340"><tspan>· <tspan fill="#1C2E24" font-weight="bold">不伪造消息</tspan>：一键浇水等行为显</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="368">  示为居中的系统记录气泡，绝对不在</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="396">  聊天界面中伪造用户发送了“浇水”。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="428"><tspan>· <tspan fill="#1C2E24" font-weight="bold">离线诚实兜底</tspan>：无法联网时直白告</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="456">  知“来自本地预设”，不糊弄用户。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="488"><tspan>· <tspan fill="#1C2E24" font-weight="bold">视觉极简克制</tspan>：未开发按钮绝不</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="880" y="516">  展示，杜绝无意义报错带来的挫折。</text></g>

  
