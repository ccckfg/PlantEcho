    <path d="M12 7a5 5 0 1 1 -4.995 5.217l-.005 -.217l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
  </g>

    <text x="485" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#1C2E24">原则二：尊重用户的节奏</text>
    <text x="485" y="295" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C">慢节奏宽容与呼吸感设计</text>

    
    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="340"><tspan>· <tspan fill="#1C2E24" font-weight="bold">撤销优先于对话框</tspan>：高风险操作</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="368">  提供“5秒撤销 Toast”，而非弹出强</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="396">  占焦点、逼迫用户确认的模态框。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="428"><tspan>· <tspan fill="#1C2E24" font-weight="bold">温柔的等待文案</tspan>：用“正在看看窗</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="456">  外…”代替单调粗暴的“正在加载”。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="488"><tspan>· <tspan fill="#1C2E24" font-weight="bold">缓动过渡</tspan>：采用固定 380ms 的弹</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="485" y="516">  性过渡动效，模拟植物的缓慢生长。</text></g>

  
  <g id="card-principle-3">
    
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M862,125 H1208 A12,12 0 0 1 1220,137 V573 A12,12 0 0 1 1208,585 H862 A12,12 0 0 1 850,573 V137 A12,12 0 0 1 862,125 Z" />
    
    
