  <g transform="translate(100.0, 180.0) scale(1.1666666666666667)" fill="#2B583E">
    <path d="M5.821 4.91c3.899 -2.765 9.468 -2.539 13.073 .535c3.667 3.129 4.168 8.238 1.152 11.898c-2.841 3.447 -7.965 4.583 -12.231 2.805l-.233 -.101l-4.374 .931l-.04 .006l-.035 .007h-.018l-.022 .005h-.038l-.033 .004l-.021 -.001l-.023 .001l-.033 -.003h-.035l-.022 -.004l-.022 -.002l-.035 -.007l-.034 -.005l-.016 -.004l-.024 -.005l-.049 -.016l-.024 -.005l-.011 -.005l-.022 -.007l-.045 -.02l-.03 -.012l-.011 -.006l-.014 -.006l-.031 -.018l-.045 -.024l-.016 -.011l-.037 -.026l-.04 -.027l-.002 -.004l-.013 -.009l-.043 -.04l-.025 -.02l-.006 -.007l-.056 -.062l-.013 -.014l-.011 -.014l-.039 -.056l-.014 -.019l-.005 -.01l-.042 -.073l-.007 -.012l-.004 -.008l-.007 -.012l-.014 -.038l-.02 -.042l-.004 -.016l-.004 -.01l-.017 -.061l-.007 -.018l-.002 -.015l-.005 -.019l-.005 -.033l-.008 -.042l-.002 -.031l-.003 -.01v-.016l-.004 -.054l.001 -.036l.001 -.023l.002 -.053l.004 -.025v-.019l.008 -.035l.005 -.034l.005 -.02l.004 -.02l.018 -.06l.003 -.013l1.15 -3.45l-.022 -.037c-2.21 -3.747 -1.209 -8.391 2.413 -11.119z" />
  </g>

    <text x="90" y="260" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#1C2E24">原则一：系统说人话</text>
    <text x="90" y="295" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C">植物视角与第一人称叙事</text>
    
    
    <text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="340"><tspan>· <tspan fill="#1C2E24" font-weight="bold">拟人化转译</tspan>：拒绝冷冰冰的系统字</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="368">  眼。把“水分: 23%”翻译成第一人</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="396">  称的“我有点渴了 · 23%”。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="428"><tspan>· <tspan fill="#1C2E24" font-weight="bold">邀请句式</tspan>：把所有的否定式报错转</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="456">  译为带有友好氛围的诚恳邀请。</text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="488"><tspan>· <tspan fill="#1C2E24" font-weight="bold">折叠技术细节</tspan>：将报错退回二级，</tspan>
      </text><text fill="#4D5F54" font-size="15" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" x="90" y="516">  主界面只显示温暖贴心的指引。</text></g>

  
  <g id="card-principle-2">
    
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M467,125 H813 A12,12 0 0 1 825,137 V573 A12,12 0 0 1 813,585 H467 A12,12 0 0 1 455,573 V137 A12,12 0 0 1 467,125 Z" />
    
    
    <path d="M 455,137 A 12,12 0 0,1 467,125 L 813,125 A 12,12 0 0,1 825,137 L 825,140 L 455,140 Z" fill="#8E5B3C" />

    
    <path fill="#8E5B3C" fill-opacity="0.08" d="M509,170 H509 A24,24 0 0 1 533,194 V194 A24,24 0 0 1 509,218 H509 A24,24 0 0 1 485,194 V194 A24,24 0 0 1 509,170 Z" />
    
