  <rect width="1280" height="720" fill="#F4F6F4" />

  
  <g id="header-group">
    <path fill="#2B583E" fill-opacity="0.08" d="M73,40 H152 A13,13 0 0 1 165,53 V53 A13,13 0 0 1 152,66 H73 A13,13 0 0 1 60,53 V53 A13,13 0 0 1 73,40 Z" />
    <text x="78" y="58" font-family="'Plus Jakarta Sans', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#2B583E">起源与初心</text>
    <text x="180" y="60" font-family="Quicksand, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">让代码拥有温度：五大“人文关怀”原则</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1" />
  </g>

  
  
  
  <g id="card-principle-1">
    
    <path fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" d="M72,125 H418 A12,12 0 0 1 430,137 V573 A12,12 0 0 1 418,585 H72 A12,12 0 0 1 60,573 V137 A12,12 0 0 1 72,125 Z" />
    
    
