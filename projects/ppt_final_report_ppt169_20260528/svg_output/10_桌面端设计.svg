<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="120" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">终端体验层</text>
    <text x="196" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">桌面客户端：轻量 Tauri v2 与 Dashboard 设计</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 左半部分卡片：Tauri v2 + Rust 核心性能 (x=60, w=560, h=460) -->
  <g id="left-card-tauri">
    <rect x="60" y="120" width="560" height="460" rx="12" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5"/>
    <path d="M 60,132 A 12,12 0 0,1 72,120 L 608,120 A 12,12 0 0,1 620,132 L 620,135 L 60,135 Z" fill="#2B583E"/>

    <!-- 标题 -->
    <rect x="90" y="155" width="40" height="40" rx="20" fill="#2B583E" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/device-cpu" x="98" y="163" width="24" height="24" fill="#2B583E"/>
    <text x="145" y="181" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">Tauri v2 极致轻量桌面骨架</text>
    <text x="145" y="205" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#809085">深度融合 React 18 + Vite 5 + TS</text>

    <!-- 特色描述 -->
    <g id="tauri-feature-1">
      <circle cx="105" cy="260" r="15" fill="#2B583E" fill-opacity="0.1"/>
      <text x="105" y="265" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="14" font-weight="bold" fill="#2B583E" text-anchor="middle">✔</text>
      <text x="135" y="255" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">极小安装包体积与冷启动开销</text>
      <text x="135" y="278" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">基于 Tauri v2 渲染引擎，冷启动冷启动内存低至数MB，包体积仅为 Electron 的 5%。</text>
    </g>

    <g id="tauri-feature-2">
      <circle cx="105" cy="350" r="15" fill="#2B583E" fill-opacity="0.1"/>
      <text x="105" y="365" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="14" font-weight="bold" fill="#2B583E" text-anchor="middle">✔</text>
      <text x="135" y="345" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">多植物路由动态控制</text>
      <text x="135" y="368" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">客户端统筹编码 <tspan font-family="Consolas, monospace" fill="#8E5B3C">plantId</tspan>，支持在同一个主应用中动态加载并无感切换多盆植物档案。</text>
    </g>

    <g id="tauri-feature-3">
      <circle cx="105" cy="440" r="15" fill="#2B583E" fill-opacity="0.1"/>
      <text x="105" y="445" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="14" font-weight="bold" fill="#2B583E" text-anchor="middle">✔</text>
      <text x="135" y="435" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">SSE 增量流式实时刷新</text>
      <text x="135" y="458" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">根部静默订阅 SSE 通道，任意设备上传读数都会动态同步至全部前端组件，无感刷新。</text>
    </g>
  </g>

  <!-- 4. 右半部分卡片：Verdant Echo 与温室 Dashboard (x=660, w=560, h=460) -->
  <g id="right-card-dashboard">
    <rect x="660" y="120" width="560" height="460" rx="12" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5"/>
    <path d="M 660,132 A 12,12 0 0,1 672,120 L 1208,120 A 12,12 0 0,1 1220,132 L 1220,135 L 660,135 Z" fill="#8E5B3C"/>

    <!-- 标题 -->
    <rect x="690" y="155" width="40" height="40" rx="20" fill="#8E5B3C" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/sun" x="698" y="163" width="24" height="24" fill="#8E5B3C"/>
    <text x="745" y="181" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">温室主页 Dashboard 交互设计</text>
    <text x="745" y="205" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#809085"> Verdan Echo 森林与土壤自然配色体系落地</text>

    <!-- 特色 -->
    <g id="dashboard-feature-1">
      <circle cx="705" cy="260" r="15" fill="#8E5B3C" fill-opacity="0.1"/>
      <text x="705" y="265" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C" text-anchor="middle">✔</text>
      <text x="735" y="255" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">时段问候语与动态天气组件</text>
      <text x="735" y="278" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">进入温室时根据时辰温馨显示“早安/午安/晚上好”，让用户每次登录都有“被植物注视”的陪伴感。</text>
    </g>

    <g id="dashboard-feature-2">
      <circle cx="705" cy="350" r="15" fill="#8E5B3C" fill-opacity="0.1"/>
      <text x="705" y="365" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C" text-anchor="middle">✔</text>
      <text x="735" y="345" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">一键浇水功能与 5 秒撤销</text>
      <text x="735" y="368" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">执行浇水后，右下角触发精致 Toast，允许用户在 5 秒内“一键撤销”，彻底消除误操作造成的烦恼。</text>
    </g>

    <g id="dashboard-feature-3">
      <circle cx="705" cy="440" r="15" fill="#8E5B3C" fill-opacity="0.1"/>
      <text x="705" y="445" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="14" font-weight="bold" fill="#8E5B3C" text-anchor="middle">✔</text>
      <text x="735" y="435" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">多植物卡片 Bento 栅格矩阵</text>
      <text x="735" y="458" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">每盆植物被独立置于一个精致卡片中，头像、状态 Chip 标签、当天一句话概括，主次分明。</text>
    </g>
  </g>

  <!-- 5. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">10</text>
  </g>
</svg>
