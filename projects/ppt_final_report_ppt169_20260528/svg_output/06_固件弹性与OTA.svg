<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 精细小箭头 -->
    <marker id="flowArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2B583E"/>
    </marker>
  </defs>

  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="120" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">硬件与物联层</text>
    <text x="196" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">固件弹性：数据持久化与 OTA 在线更新</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 上部区域：NVS 密钥持久化认领下发交互图 (y=120, h=210) -->
  <g id="top-interactive-flow">
    <!-- 区域虚线外导框 -->
    <rect x="60" y="115" width="1160" height="225" rx="10" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- 节点1：用户认领设备 (Tauri 客户端) -->
    <g id="flow-node-1">
      <rect x="100" y="150" width="220" height="150" rx="8" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="120" y="170" width="30" height="30" rx="15" fill="#2B583E" fill-opacity="0.08"/>
      <use data-icon="tabler-filled/photo" x="125" y="175" width="20" height="20" fill="#2B583E"/>
      <text x="165" y="190" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">1. Tauri 客户端认领</text>
      <text x="120" y="230" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">
        <tspan x="120" dy="0">用户在 App 发现待认</tspan>
        <tspan x="120" dy="20">领设备，输入植物名称</tspan>
        <tspan x="120" dy="20">并发起 claim 认领绑定。</tspan>
      </text>
    </g>

    <!-- 连接线 1 -> 2 -->
    <path d="M 335,225 L 495,225" stroke="#2B583E" stroke-width="2" marker-end="url(#flowArrow)"/>
    <text x="415" y="215" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E" text-anchor="middle">HTTP Claim</text>

    <!-- 节点2：生成并分发密钥 (Fastify 后端) -->
    <g id="flow-node-2">
      <rect x="510" y="150" width="260" height="150" rx="8" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="530" y="170" width="30" height="30" rx="15" fill="#8E5B3C" fill-opacity="0.08"/>
      <use data-icon="tabler-filled/database" x="535" y="175" width="20" height="20" fill="#8E5B3C"/>
      <text x="575" y="190" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">2. 后端生成加密密钥</text>
      <text x="530" y="230" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">
        <tspan x="530" dy="0">服务端为设备生成唯一的 API Key，</tspan>
        <tspan x="530" dy="20">将其 Hash 校验值持久化，并通过</tspan>
        <tspan x="530" dy="20">MQTT config 主题回传下发。</tspan>
      </text>
    </g>

    <!-- 连接线 2 -> 3 -->
    <path d="M 785,225 L 915,225" stroke="#2B583E" stroke-width="2" marker-end="url(#flowArrow)"/>
    <text x="850" y="215" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E" text-anchor="middle">MQTT Config</text>

    <!-- 节点3：自动接收与持久化 (ESP32 NVS) -->
    <g id="flow-node-3">
      <rect x="930" y="150" width="260" height="150" rx="8" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="950" y="170" width="30" height="30" rx="15" fill="#2B583E" fill-opacity="0.08"/>
      <use data-icon="tabler-filled/device-cpu" x="955" y="175" width="20" height="20" fill="#2B583E"/>
      <text x="995" y="190" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">3. ESP32 自动保存 NVS</text>
      <text x="950" y="230" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#4D5F54">
        <tspan x="950" dy="0">ESP32 接收密钥后，调用底层</tspan>
        <tspan x="950" dy="20">NVS (Non-volatile Storage) API</tspan>
        <tspan x="950" dy="20">持久化保存，断电仍可安全重连。</tspan>
      </text>
    </g>
  </g>

  <!-- 4. 下部区域：OTA 安全 Manifest 校验机制 (y=370, h=210) -->
  <g id="bottom-ota-mechanism">
    <!-- 左侧：代码与配置文件呈现 -->
    <g id="ota-code-card">
      <rect x="60" y="370" width="460" height="235" rx="8" fill="#1A3E2A" fill-opacity="0.04" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="60" y="370" width="460" height="35" rx="8" fill="#2B583E"/>
      <!-- 圆角修正叠底 -->
      <rect x="60" y="390" width="460" height="15" fill="#2B583E"/>
      
      <use data-icon="tabler-filled/leaf" x="75" y="378" width="18" height="18" fill="#FFFFFF"/>
      <text x="105" y="393" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#FFFFFF">ota_manifest.json</text>
      
      <!-- JSON 代码片 -->
      <text x="90" y="440" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="14" fill="#1C2E24">
        <tspan x="90" dy="0" fill="#809085">{</tspan>
        <tspan x="110" dy="25"><tspan fill="#8E5B3C">"version"</tspan>: <tspan fill="#3B8756">"0.2.1"</tspan>,</tspan>
        <tspan x="110" dy="25"><tspan fill="#8E5B3C">"url"</tspan>: <tspan fill="#3B8756">"http://.../firmware.bin"</tspan>,</tspan>
        <tspan x="110" dy="25"><tspan fill="#8E5B3C">"md5"</tspan>: <tspan fill="#3B8756">"9a8e2b83c...fc82"</tspan>,</tspan>
        <tspan x="110" dy="25"><tspan fill="#8E5B3C">"size_bytes"</tspan>: <tspan fill="#DDA43B">2049555</tspan></tspan>
        <tspan x="90" dy="25" fill="#809085">}</tspan>
      </text>
    </g>

    <!-- 右侧：OTA 升级流程与技术描述 (x=550, w=670) -->
    <g id="ota-desc-group">
      <rect x="550" y="370" width="40" height="40" rx="20" fill="#2B583E" fill-opacity="0.08"/>
      <use data-icon="tabler-filled/rocket" x="558" y="378" width="24" height="24" fill="#2B583E"/>
      <text x="605" y="396" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="20" font-weight="bold" fill="#1C2E24">OTA 在线无缝热更新</text>
      
      <text x="550" y="445" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
        <tspan x="550" dy="0">· <tspan fill="#1C2E24" font-weight="bold">Manifest 轻量宣告</tspan>：ESP32 定时轮询后端 HTTP/MQTT 宣告接口，</tspan>
        <tspan x="550" dy="26">  比对本地版本。一旦版本匹配升级宣告，启动静默更新。</tspan>
        <tspan x="550" dy="32">· <tspan fill="#1C2E24" font-weight="bold">MD5 数据完整性校验</tspan>：在空中下载 firmware.bin 后，固件会</tspan>
        <tspan x="550" dy="26">  在硬件端自动进行 MD5 校验，防止数据受损导致系统崩塌（Brick）。</tspan>
        <tspan x="550" dy="32">· <tspan fill="#1C2E24" font-weight="bold">热分区双备份 (Partition Rollback)</tspan>：利用 ESP32 双 OTA 分区，</tspan>
        <tspan x="550" dy="26">  新固件先写入备用区。若运行失败自动回滚，确保设备 100% 不变砖。</tspan>
      </text>
    </g>
  </g>

  <!-- 5. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">06</text>
  </g>
</svg>
