<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 指向性精细箭头 -->
    <marker id="timelineArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2B583E"/>
    </marker>
  </defs>

  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="120" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">开发历程篇</text>
    <text x="196" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">开发史诗：从“零代码”起步到“全栈完美交付”</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 中央贯穿的主轴线 (y=360) -->
  <line x1="100" y1="360" x2="1140" y2="360" stroke="#2B583E" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#timelineArrow)"/>
  <text x="1155" y="365" font-family="Quicksand, sans-serif" font-size="14" font-weight="bold" fill="#2B583E">June 2026</text>

  <!-- 4. 期中阶段卡片 (上方 x=150, y=120, w=400, h=200) -->
  <g id="mid-term-block">
    <!-- 连接虚线与主轴 -->
    <line x1="350" y1="320" x2="350" y2="360" stroke="#D64535" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="350" cy="360" r="8" fill="#D64535"/>

    <rect x="150" y="120" width="400" height="200" rx="10" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5"/>
    <path d="M 150,132 A 12,12 0 0,1 162,120 L 538,120 A 12,12 0 0,1 550,132 L 550,135 L 150,135 Z" fill="#D64535"/>

    <rect x="180" y="145" width="24" height="24" rx="12" fill="#D64535" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/message-circle" x="186" y="151" width="12" height="12" fill="#D64535"/>
    <text x="215" y="163" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#D64535">期中立项阶段 · 纸上谈兵</text>

    <!-- 期中数据 -->
    <text x="180" y="210" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
      <tspan x="180" dy="0">❌ <tspan fill="#1C2E24" font-weight="bold">核心代码</tspan>：全模块均为 <tspan fill="#D64535" font-weight="bold">0 行</tspan>。</tspan>
      <tspan x="180" dy="26">❌ <tspan fill="#1C2E24" font-weight="bold">硬件连接</tspan>：刚购入开发板，毫无硬件经验。</tspan>
      <tspan x="180" dy="26">❌ <tspan fill="#1C2E24" font-weight="bold">功能开发</tspan>：完全停留在脑图与纸面架构阶段。</tspan>
    </text>
  </g>

  <!-- 5. 期末阶段卡片 (下方 x=680, y=398, w=450, h=210) -->
  <g id="final-term-block">
    <!-- 连接虚线与主轴 -->
    <line x1="900" y1="360" x2="900" y2="400" stroke="#3B8756" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="900" cy="360" r="8" fill="#3B8756"/>

    <rect x="680" y="400" width="450" height="210" rx="10" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5"/>
    <path d="M 680,412 A 12,12 0 0,1 692,400 L 1118,400 A 12,12 0 0,1 1130,412 L 1130,415 L 680,415 Z" fill="#3B8756"/>

    <rect x="710" y="425" width="24" height="24" rx="12" fill="#3B8756" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/sun" x="716" y="431" width="12" height="12" fill="#3B8756"/>
    <text x="745" y="443" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#3B8756">期末完美交付 · 落地生根</text>

    <!-- 期末数据 -->
    <text x="710" y="490" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
      <tspan x="710" dy="0">✅ <tspan fill="#1C2E24" font-weight="bold">全栈完全落成</tspan>：后端完成度约 <tspan fill="#2B583E" font-weight="bold">90%</tspan>，客户端 <tspan fill="#2B583E" font-weight="bold">87%</tspan>。</tspan>
      <tspan x="710" dy="26">✅ <tspan fill="#1C2E24" font-weight="bold">硬件完美跑通</tspan>：ESP32 配网、1秒推流、NVS 密钥与 OTA。</tspan>
      <tspan x="710" dy="26">✅ <tspan fill="#1C2E24" font-weight="bold">工程闭环达成</tspan>：单元测试、4大 Smoke 压测、Docker 容器化。</tspan>
    </text>
  </g>

  <!-- 6. 中间文字装饰：蜕变宣告 -->
  <text x="640" y="345" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#8E5B3C" text-anchor="middle">
    经过 2 个月的全力冲刺 ─── 迎来全链路惊艳跨越
  </text>

  <!-- 7. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">13</text>
  </g>
</svg>
