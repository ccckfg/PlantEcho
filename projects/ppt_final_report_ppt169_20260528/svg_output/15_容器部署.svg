<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="120" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">工程与部署层</text>
    <text x="196" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">云端发布：Docker Hub 官方镜像与单键部署</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 左侧生产发布与验证说明 (x=60, w=330) -->
  <g id="left-docker-intro">
    <text x="60" y="145" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="22" font-weight="bold" fill="#2B583E">
      一键上云，极简交付
    </text>
    <text x="60" y="185" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
      <tspan x="60" dy="0">项目不仅在本地开发跑</tspan>
      <tspan x="60" dy="26">通，更是面向生产环境</tspan>
      <tspan x="60" dy="26">交付，通过严苛容器化</tspan>
      <tspan x="60" dy="26">构建打包并推送发布，</tspan>
      <tspan x="60" dy="26">提供完整单机灰度能力。</tspan>
    </text>

    <!-- 镜像拉取小 Bento 卡片 (Bento 弱卡) -->
    <rect x="60" y="360" width="310" height="225" rx="8" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
    
    <rect x="80" y="385" width="36" height="36" rx="18" fill="#2B583E" fill-opacity="0.08"/>
    <use data-icon="simple-icons/docker" x="88" y="393" width="20" height="20" fill="#2B583E"/>
    
    <text x="128" y="408" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">Docker Hub 官方镜像</text>
    <text x="80" y="445" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
      <tspan x="80" dy="0">镜像已成功发布至公开库：</tspan>
      <tspan x="80" dy="22" fill="#8E5B3C" font-family="Consolas, monospace" font-weight="bold">ccckfg/dyn:latest</tspan>
      <tspan x="80" dy="22">本地多阶段多机构建，移除冗</tspan>
      <tspan x="80" dy="22">余垃圾，极致压缩层级包开销。</tspan>
    </text>
  </g>

  <!-- 4. 右侧精美的 Docker-compose 部署解构框 (x=400, w=820) -->
  <g id="right-docker-compose">
    <!-- 主背景大卡片 -->
    <rect x="400" y="120" width="820" height="465" rx="16" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5"/>

    <!-- 优势卡片 1：一键单实例部署 -->
    <g id="docker-desc-block">
      <rect x="430" y="150" width="340" height="405" rx="8" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="430" y="150" width="340" height="36" rx="8" fill="#2B583E"/>
      <!-- 圆角修正叠底 -->
      <rect x="430" y="170" width="340" height="16" fill="#2B583E"/>
      <use data-icon="simple-icons/docker" x="450" y="158" width="18" height="18" fill="#FFFFFF"/>
      <text x="480" y="173" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">docker-compose.yml 部署配置</text>

      <!-- YAML 代码呈现 -->
      <text x="460" y="215" font-family="Consolas, &apos;Courier New&apos;, monospace" font-size="13" fill="#1C2E24">
        <tspan x="460" dy="0" fill="#809085">version: '3.8'</tspan>
        <tspan x="460" dy="22" fill="#2B583E">services:</tspan>
        <tspan x="480" dy="22" fill="#2B583E">  server:</tspan>
        <tspan x="500" dy="22"><tspan fill="#8E5B3C">    image:</tspan> ccckfg/dyn:latest</tspan>
        <tspan x="500" dy="22"><tspan fill="#8E5B3C">    container_name:</tspan> dyn-server</tspan>
        <tspan x="500" dy="22"><tspan fill="#8E5B3C">    ports:</tspan></tspan>
        <tspan x="520" dy="22">      - "8787:8787"</tspan>
        <tspan x="500" dy="22"><tspan fill="#8E5B3C">    environment:</tspan></tspan>
        <tspan x="520" dy="22">      - PORT=8787</tspan>
        <tspan x="520" dy="22">      - APP_ACCESS_KEY=******</tspan>
        <tspan x="500" dy="22"><tspan fill="#8E5B3C">    restart:</tspan> always</tspan>
      </text>
    </g>

    <!-- 优势卡片 2：灰度与验证说明 -->
    <g id="docker-steps-block">
      <rect x="790" y="150" width="400" height="405" rx="8" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="790" y="150" width="400" height="36" rx="8" fill="#8E5B3C"/>
      <!-- 圆角修正叠底 -->
      <rect x="790" y="170" width="400" height="16" fill="#8E5B3C"/>
      <use data-icon="tabler-filled/shield-check" x="810" y="158" width="18" height="18" fill="#FFFFFF"/>
      <text x="840" y="173" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">生产发布环境严密验证</text>

      <!-- 部署验证细节 -->
      <text x="815" y="215" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
        <tspan x="815" dy="0">· <tspan fill="#1C2E24" font-weight="bold">本地临时容器完美验证</tspan>：</tspan>
        <tspan x="815" dy="24">  在正式推送前，于本地拉起临时容器，</tspan>
        <tspan x="815" dy="24">  进行严格的 /health 存活检测和 API 键</tspan>
        <tspan x="815" dy="24">  校验；验证无误后彻底删除清理，符合</tspan>
        <tspan x="815" dy="24">  高自律工程规范，杜绝环境残留污染。</tspan>
        
        <tspan x="815" dy="36">· <tspan fill="#1C2E24" font-weight="bold">一键极简拉起服务</tspan>：</tspan>
        <tspan x="815" dy="24">  封装单机灰度 compose 配置，服务器只需</tspan>
        <tspan x="815" dy="24">  运行 <tspan font-family="Consolas, monospace" fill="#8E5B3C">docker compose up -d</tspan>，即可一键</tspan>
        <tspan x="815" dy="24">  拉取镜像并安全后台运行，开箱即用。</tspan>

        <tspan x="815" dy="36">· <tspan fill="#1C2E24" font-weight="bold">安全鉴权机制收口</tspan>：</tspan>
        <tspan x="815" dy="24">  外部注入访问密钥强制拦截非授权，仅</tspan>
        <tspan x="815" dy="24">  保留设备 MQTT readings 接收鉴权口。</tspan>
      </text>
    </g>
  </g>

  <!-- 5. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">15</text>
  </g>
</svg>
