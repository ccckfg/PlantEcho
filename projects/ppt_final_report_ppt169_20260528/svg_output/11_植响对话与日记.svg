<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="120" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">终端体验层</text>
    <text x="196" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">植响对话与里程碑成长日记</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 左侧设计理念说明 (x=60, w=330) -->
  <g id="left-concepts">
    <text x="60" y="145" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="22" font-weight="bold" fill="#2B583E">
      看见，与被看见
    </text>
    <text x="60" y="185" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
      <tspan x="60" dy="0">项目构建了人与植物的</tspan>
      <tspan x="60" dy="26">双向情感闭环，聊天室</tspan>
      <tspan x="60" dy="26">与成长日记里程碑不再</tspan>
      <tspan x="60" dy="26">只是数据看板，而是爱</tspan>
      <tspan x="60" dy="26">与记忆的见证地。</tspan>
    </text>

    <!-- Bento 装饰微卡 -->
    <rect x="60" y="350" width="310" height="235" rx="8" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
    
    <rect x="80" y="375" width="36" height="36" rx="18" fill="#8E5B3C" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/message-circle" x="88" y="383" width="20" height="20" fill="#8E5B3C"/>
    
    <text x="128" y="398" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">对话流式回复</text>
    <text x="80" y="435" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
      <tspan x="80" dy="0">基于 Server-Sent Events 流式</tspan>
      <tspan x="80" dy="22">展现大模型回复字句，并自动</tspan>
      <tspan x="80" dy="22">嵌入快捷动作，交互如流水般自然。</tspan>
    </text>

    <rect x="80" y="490" width="36" height="36" rx="18" fill="#2B583E" fill-opacity="0.08"/>
    <use data-icon="tabler-filled/photo" x="88" y="498" width="20" height="20" fill="#2B583E"/>

    <text x="128" y="513" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="16" font-weight="bold" fill="#1C2E24">里程碑双向寄语</text>
    <text x="80" y="550" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
      <tspan x="80" dy="0">日记里程碑卡片悬停即可写下</tspan>
      <tspan x="80" dy="22">留言，空中留言寄语永久被写</tspan>
      <tspan x="80" dy="22">入植物的长期记忆。建立情感强关联。</tspan>
    </text>
  </g>

  <!-- 4. 右侧精细的聊天与日记功能拆解框 (x=400, w=820) -->
  <g id="right-feature-cards">
    <!-- 主背景大卡片 -->
    <rect x="400" y="120" width="820" height="465" rx="16" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1.5"/>

    <!-- 右半部分 1：植响聊天面板 (x=430, w=360) -->
    <g id="chat-sub-card">
      <rect x="430" y="145" width="360" height="415" rx="10" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="430" y="145" width="360" height="40" rx="10" fill="#2B583E"/>
      <rect x="430" y="170" width="360" height="15" fill="#2B583E"/> <!-- 圆角覆盖面 -->
      <use data-icon="tabler-filled/message-circle" x="450" y="153" width="24" height="24" fill="#FFFFFF"/>
      <text x="485" y="171" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">植响对话 (Chat Room)</text>

      <!-- 聊天消息气泡展示 -->
      <!-- 植物消息 -->
      <path d="M 450,215 L 460,205 L 730,205 L 730,285 L 450,285 Z" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="465" y="215" width="16" height="16" rx="8" fill="#2B583E" fill-opacity="0.08"/>
      <use data-icon="tabler-filled/leaf" x="468" y="218" width="10" height="10" fill="#2B583E"/>
      <text x="490" y="228" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="11" fill="#8E5B3C" font-weight="bold">小绿 · 思考了3秒</text>
      <text x="465" y="255" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#1C2E24">
        “昨天泥土干干的时候，你为我唱了一首歌，
      </text>
      <text x="465" y="275" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#2B583E" font-weight="bold">
        小绿已经把歌声藏在树叶里啦 🎶”
      </text>

      <!-- 系统浇水 Chip 气泡 -->
      <rect x="490" y="305" width="240" height="30" rx="15" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
      <use data-icon="tabler-filled/leaf" x="510" y="312" width="16" height="16" fill="#3B8756"/>
      <text x="535" y="325" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" fill="#4D5F54">📝 <tspan fill="#1C2E24" font-weight="bold">你</tspan>为小绿记录了一次浇水</text>

      <!-- 底部输入框与快捷动作 -->
      <rect x="450" y="475" width="320" height="65" rx="8" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
      
      <!-- 快捷动作 Chip -->
      <rect x="465" y="487" width="75" height="20" rx="10" fill="#2B583E" fill-opacity="0.08"/>
      <text x="502" y="501" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" font-weight="bold" fill="#2B583E" text-anchor="middle">💧 已浇水</text>
      
      <rect x="550" y="487" width="75" height="20" rx="10" fill="#2B583E" fill-opacity="0.08"/>
      <text x="587" y="501" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" font-weight="bold" fill="#2B583E" text-anchor="middle">☀️ 已晒太阳</text>

      <text x="465" y="528" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" fill="#809085">输入悄悄话...</text>
    </g>

    <!-- 右半部分 2：成长日记里程碑 (x=820, w=370) -->
    <g id="journal-sub-card">
      <rect x="810" y="145" width="380" height="415" rx="10" fill="#F4F6F4" stroke="#D1DAD4" stroke-width="1"/>
      <rect x="810" y="145" width="380" height="40" rx="10" fill="#8E5B3C"/>
      <rect x="810" y="170" width="380" height="15" fill="#8E5B3C"/> <!-- 圆角覆盖面 -->
      <use data-icon="tabler-filled/photo" x="830" y="153" width="24" height="24" fill="#FFFFFF"/>
      <text x="865" y="171" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">成长日记 (Milestone Journal)</text>

      <!-- Bento 统计微卡 -->
      <rect x="830" y="200" width="340" height="60" rx="8" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
      <text x="850" y="235" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">成长积分：<tspan fill="#2B583E">1280</tspan></text>
      <text x="980" y="235" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">羁绊深度：<tspan fill="#8E5B3C">极深 (98)</tspan></text>

      <!-- 里程碑时间线 -->
      <line x1="850" y1="285" x2="850" y2="530" stroke="#D1DAD4" stroke-width="2"/>
      
      <!-- 节点 1 -->
      <circle cx="850" cy="305" r="6" fill="#3B8756"/>
      <rect x="870" y="285" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
      <!-- 里程碑高亮动效标识 -->
      <path d="M 870,291 A 6,6 0 0,1 876,285 L 890,285 L 870,305 Z" fill="#DDA43B"/>
      
      <text x="890" y="308" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#8E5B3C">2026-05-25  |  长期记忆生成</text>
      <text x="890" y="330" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" font-weight="bold" fill="#1C2E24">“你第一次为我唱歌”</text>
      <text x="890" y="352" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="11" fill="#2B583E">💬 你的回应：“小绿要快快长大噢”</text>

      <!-- 节点 2 -->
      <circle cx="850" cy="425" r="6" fill="#3B8756"/>
      <rect x="870" y="405" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
      <text x="890" y="428" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#809085">2026-05-20  |  设备首次被认领</text>
      <text x="890" y="452" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" font-weight="bold" fill="#1C2E24">“小绿的第一天，请多关照”</text>
      <text x="890" y="475" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="11" fill="#809085">悬停里程碑以留下你的寄语...</text>
    </g>
  </g>

  <!-- 5. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">11</text>
  </g>
</svg>
