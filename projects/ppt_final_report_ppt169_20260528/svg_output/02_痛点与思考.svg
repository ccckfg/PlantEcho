<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 图片16px圆角剪裁 -->
    <clipPath id="painPointClip">
      <rect x="720" y="110" width="460" height="500" rx="16"/>
    </clipPath>
  </defs>

  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="105" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">起源与初心</text>
    <text x="180" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">痛点思考：传统养护系统的“冰冷”</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 左侧大段呼吸留白与核心要点文字 (占据 60% x=60, w=600) -->
  <g id="pain-points-content">
    <text x="60" y="160" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="22" font-weight="bold" fill="#8E5B3C">
      为什么说绝大多数智能养护只是“传感器看板”？
    </text>

    <!-- 痛点 1 -->
    <g id="point-1">
      <circle cx="80" cy="235" r="16" fill="#D64535" fill-opacity="0.1"/>
      <text x="80" y="241" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="16" font-weight="bold" fill="#D64535" text-anchor="middle">1</text>
      <text x="112" y="232" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">
        孤立的传感器读数
      </text>
      <text x="112" y="258" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
        满屏冷漠的“水分 23% / 温度 28°C”，用户难以产生情感照料动力。
      </text>
    </g>

    <!-- 痛点 2 -->
    <g id="point-2">
      <circle cx="80" cy="345" r="16" fill="#D64535" fill-opacity="0.1"/>
      <text x="80" y="351" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="16" font-weight="bold" fill="#D64535" text-anchor="middle">2</text>
      <text x="112" y="342" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">
        缺失植物性格与语境
      </text>
      <text x="112" y="368" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
        传感器读数不等于心情，简单暴力的数值报警极易引发养护焦虑。
      </text>
    </g>

    <!-- 痛点 3 -->
    <g id="point-3">
      <circle cx="80" cy="455" r="16" fill="#D64535" fill-opacity="0.1"/>
      <text x="80" y="461" font-family="&apos;Plus Jakarta Sans&apos;, sans-serif" font-size="16" font-weight="bold" fill="#D64535" text-anchor="middle">3</text>
      <text x="112" y="452" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">
        被动的单向数据上报
      </text>
      <text x="112" y="478" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
        由于缺乏长期记忆与主动反馈机制，人与植物之间无法建立羁绊。
      </text>
    </g>

    <!-- 总结性警示框 (Bento式弱卡片) -->
    <rect x="60" y="535" width="600" height="75" rx="10" fill="#FFFFFF" stroke="#D1DAD4" stroke-width="1"/>
    <use data-icon="tabler-filled/message-circle" x="80" y="552" width="40" height="40" fill="#D64535" fill-opacity="0.8"/>
    <text x="135" y="568" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" font-weight="bold" fill="#1C2E24">
      这促使我们思考：如何将冰冷的传感器数值转化为
    </text>
    <text x="135" y="594" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#2B583E" font-weight="bold">
      “说人话、带温度、拥有长期记忆与共情力”的数字生命？
    </text>
  </g>

  <!-- 4. 右侧精美 AI 插图嵌入 (圆角裁剪) -->
  <g id="pain-image-container">
    <!-- 装饰背景微光 -->
    <rect x="705" y="95" width="490" height="530" rx="20" fill="#FFFFFF" fill-opacity="0.5" stroke="#D1DAD4" stroke-width="1"/>
    <!-- 高清图片 -->
    <image href="../images/pain_point.png" x="720" y="110" width="460" height="500" clip-path="url(#painPointClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 5. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">02</text>
  </g>
</svg>
