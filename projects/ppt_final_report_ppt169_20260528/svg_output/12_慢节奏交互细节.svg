<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 16px圆角剪裁 -->
    <clipPath id="humanCareClip">
      <rect x="720" y="110" width="460" height="500" rx="16"/>
    </clipPath>
  </defs>

  <!-- 1. 温润的浅绿背景 -->
  <rect width="1280" height="720" fill="#F4F6F4"/>

  <!-- 2. 顶部Header区域 -->
  <g id="header-group">
    <rect x="60" y="40" width="120" height="26" rx="13" fill="#2B583E" fill-opacity="0.08"/>
    <text x="78" y="58" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="12" font-weight="bold" fill="#2B583E">终端体验层</text>
    <text x="196" y="60" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="32" font-weight="bold" fill="#1C2E24">慢交互细节：植物呼吸节奏的视觉落地</text>
    <line x1="60" y1="85" x2="1220" y2="85" stroke="#D1DAD4" stroke-width="1"/>
  </g>

  <!-- 3. 左侧大段呼吸留白与交互亮点描述 (x=60, w=600) -->
  <g id="slow-interaction-details">
    <text x="60" y="145" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="22" font-weight="bold" fill="#2B583E">
      植物的世界，没有“立刻不可逆”
    </text>
    <text x="60" y="180" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="15" fill="#4D5F54">
      我们为用户打造了一个耐心、宽容且充满触觉手感的情感空间：
    </text>

    <!-- 细节1 -->
    <g id="detail-1">
      <use data-icon="tabler-filled/circle-check" x="60" y="222" width="22" height="22" fill="#2B583E"/>
      <text x="95" y="238" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">两端高精渐变淡出遮罩</text>
      <text x="95" y="264" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
        滚动列表边缘采用精心设计的 alpha 渐变软过渡，彻底消除冷硬的切割感。
      </text>
    </g>

    <!-- 细节2 -->
    <g id="detail-2">
      <use data-icon="tabler-filled/circle-check" x="60" y="312" width="22" height="22" fill="#2B583E"/>
      <text x="95" y="328" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">380ms 呼吸缓动过渡与 8px 上推</text>
      <text x="95" y="354" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
        所有的界面切换和侧拉抽屉都不做生硬瞬切，完美契合植物生长的从容。
      </text>
    </g>

    <!-- 细节3 -->
    <g id="detail-3">
      <use data-icon="tabler-filled/circle-check" x="60" y="402" width="22" height="22" fill="#2B583E"/>
      <text x="95" y="418" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">点击手感微缩放回弹反馈</text>
      <text x="95" y="444" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
        所有的交互卡片和按钮默认附带 active:scale-[0.97] 的弹力形变，充满治愈手感。
      </text>
    </g>

    <!-- 细节4 -->
    <g id="detail-4">
      <use data-icon="tabler-filled/circle-check" x="60" y="492" width="22" height="22" fill="#2B583E"/>
      <text x="95" y="508" font-family="Quicksand, &apos;Microsoft YaHei&apos;, sans-serif" font-size="18" font-weight="bold" fill="#1C2E24">键盘友好型 focus-visible 环</text>
      <text x="95" y="534" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="14" fill="#4D5F54">
        只有在使用键盘 Tab 键导航时才点亮聚焦，平时鼠标操作绝无恼人的残存边框。
      </text>
    </g>

    <!-- 总结小标牌 (Bento 弱卡) -->
    <rect x="60" y="565" width="600" height="45" rx="6" fill="#2B583E" fill-opacity="0.04" stroke="#D1DAD4" stroke-width="1"/>
    <text x="80" y="593" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="13" fill="#2B583E" font-weight="bold">
      💡 我们彻底摒弃了红色和警告感叹号，状态变化统一走温暖的琥珀色过渡，传递诚实与信赖。
    </text>
  </g>

  <!-- 4. 右侧精美的 AI 插画嵌入 (圆角裁剪) -->
  <g id="human-image-container">
    <!-- 装饰框板 -->
    <rect x="705" y="95" width="490" height="530" rx="20" fill="#FFFFFF" fill-opacity="0.5" stroke="#D1DAD4" stroke-width="1"/>
    <!-- 图片 -->
    <image href="../images/human_care.png" x="720" y="110" width="460" height="500" clip-path="url(#humanCareClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 5. Footer 页脚 -->
  <g id="footer-group">
    <text x="60" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085">DYN Plant Pal | 期末项目答辩</text>
    <text x="1200" y="685" font-family="&apos;Plus Jakarta Sans&apos;, &apos;Microsoft YaHei&apos;, sans-serif" font-size="10" fill="#809085" text-anchor="end">12</text>
  </g>
</svg>
