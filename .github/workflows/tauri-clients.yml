name: Build Tauri Clients

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "app-v*"
    paths:
      - ".github/workflows/tauri-clients.yml"
      - "apps/desktop/**"
      - "packages/shared/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            args: ""
            rust_targets: ""
          - label: macos-arm64
            runner: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rust_targets: "aarch64-apple-darwin"
          - label: macos-x64
            runner: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rust_targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.label }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @dyn/shared

      - name: Build Tauri desktop client
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plantecho-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*zh-CN.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe

  android:
    name: Build android-release-signed
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Export Android NDK environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: android-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            android-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @dyn/shared

      - name: Initialize generated Android project
        run: npm run tauri --workspace @dyn/desktop -- android init

      - name: Refuse unsigned Android release
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          missing=0
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::notice::Android release builds require a private release keystore. This workflow refuses unsigned/debug APK output."
            exit 1
          fi

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/plantecho-upload-keystore.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cd apps/desktop/src-tauri/gen/android
          printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" > keystore.properties
          printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" >> keystore.properties
          printf 'storeFile=%s\n' "$KEYSTORE_PATH" >> keystore.properties
          cd "$GITHUB_WORKSPACE"
          node scripts/ci/configure-android-signing.mjs

      - name: Build signed Tauri Android client
        run: npm run tauri --workspace @dyn/desktop -- android build --apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plantecho-android-signed
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/**/*.apk

  release:
    name: Publish GitHub Release
    needs:
      - desktop
      - android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          find dist/artifacts -type f \
            \( -name '*.apk' -o -name '*zh-CN.msi' -o -name '*.exe' -o -name '*.dmg' \) \
            -print0 | while IFS= read -r -d '' file; do
              artifact="${file#dist/artifacts/}"
              artifact="${artifact%%/*}"
              cp "$file" "dist/release-assets/${artifact}-$(basename "$file")"
            done
          test "$(find dist/release-assets -type f | wc -l)" -gt 0
          ls -lh dist/release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: PlantEcho ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/release-assets/*
          fail_on_unmatched_files: true
