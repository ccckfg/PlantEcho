name: Build Tauri Clients

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "app-v*"
    paths:
      - ".github/workflows/tauri-clients.yml"
      - "apps/desktop/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            args: ""
            rust_targets: ""
          - label: macos-arm64
            runner: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rust_targets: "aarch64-apple-darwin"
          - label: macos-x64
            runner: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rust_targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.label }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @dyn/shared

      - name: Build Tauri desktop client
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plantecho-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe

  android:
    name: Build android-release-signed
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Export Android NDK environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: android-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            android-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @dyn/shared

      - name: Initialize generated Android project
        run: npm run tauri --workspace @dyn/desktop -- android init

      - name: Refuse unsigned Android release
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          missing=0
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::notice::Android release builds require a private release keystore. This workflow refuses unsigned/debug APK output."
            exit 1
          fi

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/plantecho-upload-keystore.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cd apps/desktop/src-tauri/gen/android
          printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" > keystore.properties
          printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" >> keystore.properties
          printf 'storeFile=%s\n' "$KEYSTORE_PATH" >> keystore.properties
          cd "$GITHUB_WORKSPACE"
          node <<'JS'
          const fs = require("node:fs");

          const manifestPath = "apps/desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          if (!manifest.includes("android:usesCleartextTraffic")) {
            manifest = manifest.replace(
              /<application\b/,
              '<application android:usesCleartextTraffic="true"'
            );
            fs.writeFileSync(manifestPath, manifest);
          }

          const gradlePath = "apps/desktop/src-tauri/gen/android/app/build.gradle.kts";
          let gradle = fs.readFileSync(gradlePath, "utf8");
          const imports = [];
          if (!gradle.includes("import java.io.FileInputStream")) {
            imports.push("import java.io.FileInputStream");
          }
          if (!gradle.includes("import java.util.Properties")) {
            imports.push("import java.util.Properties");
          }
          if (imports.length > 0) {
            gradle = `${imports.join("\n")}\n${gradle}`;
          }

          if (!gradle.includes("signingConfigs")) {
            const signingConfig = `    signingConfigs {
                create("release") {
                    val keystorePropertiesFile = rootProject.file("keystore.properties")
                    val keystoreProperties = Properties()
                    if (keystorePropertiesFile.exists()) {
                        keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                    }
                    keyAlias = keystoreProperties["keyAlias"] as String
                    keyPassword = keystoreProperties["password"] as String
                    storeFile = file(keystoreProperties["storeFile"] as String)
                    storePassword = keystoreProperties["password"] as String
                }
            }

          `;
            gradle = gradle.replace(/android\s*\{\s*/, (match) => `${match}\n${signingConfig}`);
          }

          if (!/signingConfig\s*=\s*signingConfigs\.getByName\("release"\)/.test(gradle)) {
            const next = gradle.replace(
              /getByName\("release"\)\s*\{\s*/,
              (match) => `${match}\n            signingConfig = signingConfigs.getByName("release")\n`
            );
            if (next === gradle) {
              throw new Error("Could not find Gradle release buildType to attach Android signing config.");
            }
            gradle = next;
          }

          fs.writeFileSync(gradlePath, gradle);
          JS

      - name: Build signed Tauri Android client
        run: npm run tauri --workspace @dyn/desktop -- android build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plantecho-android-signed
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/**/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/**/*.aab
