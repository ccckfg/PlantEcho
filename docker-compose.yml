services:
  dyn-server:
    image: ${DYN_IMAGE:-ccckfg/dyn:1.0.0}
    container_name: dyn-server
    restart: unless-stopped
    init: true
    env_file:
      - ./dyn.env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      HOST: 0.0.0.0
      PORT: 8787
      DYN_DATA_DIR: /app/data
      MQTT_HOST: 0.0.0.0
      MQTT_PORT: 1883
    ports:
      - "${HTTP_PUBLIC_PORT:-8787}:8787"
      - "${MQTT_PUBLIC_PORT:-1883}:1883"
    volumes:
      - ${DYN_DATA_PATH:-./data}:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
