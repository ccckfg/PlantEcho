services:
  dyn-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dyn}
      POSTGRES_USER: ${POSTGRES_USER:-dyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dyn-local-password}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - dyn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  dyn-server:
    image: ccckfg/dyn:latest
    restart: unless-stopped
    init: true
    env_file:
      - ./dyn.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dyn}:${POSTGRES_PASSWORD:-dyn-local-password}@dyn-postgres:5432/${POSTGRES_DB:-dyn}
    ports:
      - "${HTTP_PUBLIC_PORT:-8787}:8787"
      - "${MQTT_PUBLIC_PORT:-1883}:1883"
    volumes:
      - ${DYN_DATA_PATH:-./data}:/app/data
    depends_on:
      dyn-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dyn-postgres-data:
