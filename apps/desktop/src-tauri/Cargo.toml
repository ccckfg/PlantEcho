[package]
name = "plant-echo"
version = "0.1.10"
description = "PlantEcho desktop client"
authors = ["DYN"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "plant_echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
